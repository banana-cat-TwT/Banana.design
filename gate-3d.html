    <!-- 认证逻辑：与 gate.js 保持一致（djb2 哈希 + 4 小时 / 每日失效） -->
    <script>
        (function () {
            var GATE_HASH = '7c7c2e23'; // 密码 7896 的 djb2 哈希
            var STORAGE_KEY = 'bc_site_pass';
            var MAX_AGE = 4 * 60 * 60 * 1000;

            function hashPin(s) {
                var h = 5381;
                for (var i = 0; i < s.length; i++) {
                    h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
                }
                return h.toString(16);
            }
            function isSameDay(a, b) {
                var d1 = new Date(a), d2 = new Date(b);
                return d1.getFullYear() === d2.getFullYear() &&
                    d1.getMonth() === d2.getMonth() &&
                    d1.getDate() === d2.getDate();
            }
            function isGranted() {
                try {
                    var t = parseInt(localStorage.getItem(STORAGE_KEY), 10);
                    if (!t) return false;
                    return (Date.now() - t < MAX_AGE) && isSameDay(t, Date.now());
                } catch (e) { return false; }
            }
            function getNext() {
                var next = new URLSearchParams(location.search).get('next');
                if (!next) return 'index.html';
                try {
                    var u = new URL(next, location.origin);
                    if (u.origin === location.origin && !/^(javascript|data|vbscript):/i.test(next)) return next;
                } catch (e) {}
                return 'index.html';
            }

            var input = document.getElementById('gate-input');
            var btn = document.getElementById('gate-btn');
            var err = document.getElementById('gate-error');
            var card = document.getElementById('gate-card');

            // 已放行则直接回跳，不展示密码门
            if (isGranted()) {
                location.replace(getNext());
                return;
            }

            function allow() {
                try { localStorage.setItem(STORAGE_KEY, String(Date.now())); } catch (e) {}
                card.classList.add('leaving');
                document.querySelectorAll('.pill, .brand').forEach(function (el) { el.classList.add('hide'); });
                setTimeout(function () { location.replace(getNext()); }, 520);
            }
            function deny() {
                err.textContent = '密码不正确，请重试';
                input.value = '';
                input.focus();
                card.animate(
                    [{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }],
                    { duration: 320, easing: 'ease-in-out' }
                );
            }
            function check() {
                if (hashPin(input.value) === GATE_HASH) allow(); else deny();
            }

            btn.addEventListener('click', check);
            input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
            input.focus();
        })();
    </script>

    <!-- 3D 沙盘场景（Three.js，独立模块，加载失败不影响认证） -->
    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const canvas = document.getElementById('scene-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;

        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0xEAF2EE, 34, 96);

        const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
        camera.position.set(0, 10, 16);

        // ── 光照 ──
        scene.add(new THREE.HemisphereLight(0xFFFFFF, 0xE8D5B5, 0.85));
        const sun = new THREE.DirectionalLight(0xFFF6E8, 2.0);
        sun.position.set(14, 20, 10);
        sun.castShadow = true;
        sun.shadow.mapSize.set(1024, 1024);
        sun.shadow.camera.near = 1;
        sun.shadow.camera.far = 80;
        sun.shadow.camera.left = -20;
        sun.shadow.camera.right = 20;
        sun.shadow.camera.top = 20;
        sun.shadow.camera.bottom = -20;
        sun.shadow.bias = -0.0004;
        sun.shadow.normalBias = 0.02;
        scene.add(sun);

        // ── 材质 ──
        const M = {
            sand: new THREE.MeshStandardMaterial({ color: 0xE6D3B3, roughness: 0.95 }),
            sandDark: new THREE.MeshStandardMaterial({ color: 0xD9C29B, roughness: 0.95 }),
            grass: new THREE.MeshStandardMaterial({ color: 0x9BC99B, roughness: 0.9 }),
            grassDeep: new THREE.MeshStandardMaterial({ color: 0x7FB87F, roughness: 0.9 }),
            water: new THREE.MeshStandardMaterial({ color: 0x8FC8E8, roughness: 0.2, metalness: 0.05 }),
            roof: new THREE.MeshStandardMaterial({ color: 0xE8A87C, roughness: 0.7 }),
            wall: new THREE.MeshStandardMaterial({ color: 0xF5E9D6, roughness: 0.8 }),
            trunk: new THREE.MeshStandardMaterial({ color: 0x8B6B4A, roughness: 0.9 }),
            leaf: new THREE.MeshStandardMaterial({ color: 0x7BBF7B, roughness: 0.9 }),
            leaf2: new THREE.MeshStandardMaterial({ color: 0x5FA85F, roughness: 0.9 }),
            accent: new THREE.MeshStandardMaterial({ color: 0xF0B078, roughness: 0.6 }),
        };

        function box(w, h, d, mat) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = true; m.receiveShadow = true; return m; }
        function cyl(rt, rb, h, mat, seg = 20) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.castShadow = true; m.receiveShadow = true; return m; }
        function cone(r, h, mat, seg = 20) { const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg), mat); m.castShadow = true; m.receiveShadow = true; return m; }
        function sphere(r, mat, seg = 18) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, seg), mat); m.castShadow = true; m.receiveShadow = true; return m; }

        // ── 底座沙盘 ──
        const base = cyl(13, 13.6, 0.6, M.sand, 48);
        base.position.y = -0.3;
        base.receiveShadow = true;
        scene.add(base);

        // 底座装饰环
        const ring = new THREE.Mesh(new THREE.TorusGeometry(10.5, 0.14, 8, 60), M.sandDark);
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = 0.02;
        ring.receiveShadow = true;
        scene.add(ring);

        // ── 草地地块 + 主题物件 ──
        const plots = [
            { ang: -72, r: 6.4, mat: M.grass, type: 'studio' },   // 作品展示
            { ang: -144, r: 6.4, mat: M.grassDeep, type: 'character' }, // 角色展示
            { ang: 144, r: 6.4, mat: M.grass, type: 'game' },     // 小游戏
            { ang: 72, r: 6.4, mat: M.grassDeep, type: 'blog' },  // 开发日志
            { ang: 178, r: 6.9, mat: M.grass, type: 'about' },    // 关于我
        ];

        function addPlot(p) {
            const x = Math.cos(p.ang * Math.PI / 180) * p.r;
            const z = Math.sin(p.ang * Math.PI / 180) * p.r;
            const g = new THREE.Group();
            const pad = cyl(1.7, 1.9, 0.4, p.mat);
            pad.position.set(x, 0.2, z);
            scene.add(pad);

            switch (p.type) {
                case 'studio': {
                    const b = box(1.5, 1.3, 1.1, M.wall); b.position.set(x, 0.85, z); scene.add(b);
                    const r = new THREE.Mesh(new THREE.ConeGeometry(1.15, 0.7, 4), M.roof); r.position.set(x, 1.85, z); r.rotation.y = Math.PI / 4; r.castShadow = true; scene.add(r);
                    const door = box(0.4, 0.55, 0.06, M.trunk); door.position.set(x, 0.55, z + 0.56); scene.add(door);
                    break;
                }
                case 'character': {
                    const ped = cyl(0.6, 0.7, 0.5, M.wall); ped.position.set(x, 0.65, z); scene.add(ped);
                    const head = sphere(0.42, M.accent); head.position.set(x, 1.25, z); scene.add(head);
                    break;
                }
                case 'game': {
                    const b = box(1.4, 1.2, 1.2, M.wall); b.position.set(x, 0.8, z); scene.add(b);
                    const r = new THREE.Mesh(new THREE.ConeGeometry(1.0, 0.9, 4), M.leaf2); r.position.set(x, 1.75, z); r.rotation.y = Math.PI / 4; r.castShadow = true; scene.add(r);
                    break;
                }
                case 'blog': {
                    const t = cyl(0.55, 0.7, 2.6, M.wall); t.position.set(x, 1.5, z); scene.add(t);
                    const top = cone(0.85, 0.8, M.roof); top.position.set(x, 3.1, z); scene.add(top);
                    const light = sphere(0.22, M.accent); light.position.set(x, 3.35, z); scene.add(light);
                    break;
                }
                case 'about': {
                    const b = box(1.3, 1.0, 1.0, M.wall); b.position.set(x, 0.7, z); scene.add(b);
                    const r = new THREE.Mesh(new THREE.ConeGeometry(1.0, 0.75, 4), M.roof); r.position.set(x, 1.45, z); r.rotation.y = Math.PI / 4; r.castShadow = true; scene.add(r);
                    break;
                }
            }

            // 每块地种 2-3 棵树
            const treeCount = 2 + Math.floor(Math.random() * 2);
            for (let i = 0; i < treeCount; i++) {
                const a = Math.random() * Math.PI * 2;
                const rr = 1.1 + Math.random() * 1.1;
                const tx = x + Math.cos(a) * rr;
                const tz = z + Math.sin(a) * rr;
                const th = 0.5 + Math.random() * 0.5;
                const trunk = cyl(0.09, 0.12, th, M.trunk); trunk.position.set(tx, 0.2 + th / 2, tz); scene.add(trunk);
                const leaf = cone(0.32 + Math.random() * 0.14, 0.7 + Math.random() * 0.3, Math.random() > 0.5 ? M.leaf : M.leaf2);
                leaf.position.set(tx, 0.2 + th + 0.28, tz); scene.add(leaf);
            }
        }
        plots.forEach(addPlot);

        // ── 中央小池塘 ──
        const pond = cyl(1.6, 1.6, 0.12, M.water, 28);
        pond.position.set(0, 0.06, 3.2);
        pond.receiveShadow = true;
        scene.add(pond);
        const pondRim = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.1, 8, 40), M.sandDark);
        pondRim.rotation.x = -Math.PI / 2;
        pondRim.position.set(0, 0.05, 3.2);
        scene.add(pondRim);

        // ── 散落小树 ──
        for (let i = 0; i < 10; i++) {
            const a = Math.random() * Math.PI * 2;
            const r = 3.2 + Math.random() * 6;
            const tx = Math.cos(a) * r;
            const tz = Math.sin(a) * r;
            const th = 0.4 + Math.random() * 0.5;
            const trunk = cyl(0.08, 0.1, th, M.trunk); trunk.position.set(tx, 0.3 + th / 2, tz); scene.add(trunk);
            const leaf = cone(0.26 + Math.random() * 0.14, 0.6 + Math.random() * 0.3, Math.random() > 0.5 ? M.leaf : M.leaf2);
            leaf.position.set(tx, 0.3 + th + 0.24, tz); scene.add(leaf);
        }

        // ── 漂浮装饰（带浮动动画） ──
        const floaters = [];
        function addFloater(geo, mat, x, y, z, amp, speed, phase) {
            const m = new THREE.Mesh(geo, mat);
            m.position.set(x, y, z);
            m.castShadow = true;
            scene.add(m);
            floaters.push({ m, baseY: y, amp, speed, phase });
        }
        addFloater(new THREE.BoxGeometry(0.4, 0.4, 0.4), M.accent, -3.5, 2.2, 2.5, 0.35, 1.3, 0);
        addFloater(new THREE.TorusGeometry(0.3, 0.1, 10, 24), M.roof, 3.4, 2.6, 2.0, 0.3, 1.6, 1.5);
        addFloater(new THREE.OctahedronGeometry(0.34), M.leaf2, 4.2, 2.4, -2.6, 0.4, 1.1, 2.4);
        addFloater(new THREE.IcosahedronGeometry(0.3), M.water, -4.4, 2.5, -2.2, 0.32, 1.4, 0.8);

        // ── 云朵 ──
        const clouds = [];
        function addCloud(x, y, z, s) {
            const g = new THREE.Group();
            const m = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 1 });
            const parts = [[0,0,0,1.1,0.5,0.8],[0.7,0.1,0.1,0.7,0.4,0.55],[-0.6,0.05,-0.1,0.75,0.42,0.6],[0.25,0.15,-0.3,0.5,0.32,0.45]];
            parts.forEach(function (p) {
                const s2 = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), m);
                s2.scale.set(p[3] * s, p[4] * s, p[5] * s);
                s2.position.set(p[0] * s, p[1] * s, p[2] * s);
                s2.castShadow = false;
                g.add(s2);
            });
            g.position.set(x, y, z);
            scene.add(g);
            clouds.push({ g, x, speed: 0.05 + Math.random() * 0.06, drift: Math.random() * 6 });
        }
        addCloud(-7, 8.5, -4, 1.0);
        addCloud(6, 9, 2, 0.85);
        addCloud(2, 9.5, -8, 1.15);
        addCloud(-4, 8, 7, 0.9);

        // ── 鼠标视差 ──
        const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
        addEventListener('pointermove', function (e) {
            mouse.tx = (e.clientX / innerWidth) * 2 - 1;
            mouse.ty = (e.clientY / innerHeight) * 2 - 1;
        });

        // ── 动画 ──
        const clock = new THREE.Clock();
        let orbit = 0.3;
        renderer.setAnimationLoop(function () {
            const t = clock.getElapsedTime();
            orbit += 0.0009;

            mouse.x += (mouse.tx - mouse.x) * 0.05;
            mouse.y += (mouse.ty - mouse.y) * 0.05;

            const r = 16.5;
            const camX = Math.cos(orbit) * r + mouse.x * 1.3;
            const camZ = Math.sin(orbit) * r;
            const camY = 10 - mouse.y * 0.8;
            camera.position.set(camX, camY, camZ);
            camera.lookAt(0, 1.1, 0);

            for (const f of floaters) {
                f.m.position.y = f.baseY + Math.sin(t * f.speed + f.phase) * f.amp;
                f.m.rotation.y = t * 0.6;
            }
            for (const c of clouds) {
                c.g.position.x = c.x + Math.sin(t * c.speed + c.drift) * 2.5;
            }

            renderer.render(scene, camera);
        });

        addEventListener('resize', function () {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
</html>
