        :root {

        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;

            font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;

        .vignette {

        .brand span {

            line-height: 1.95;
            color: var(--ink-soft);
            letter-spacing: 0.4px;

        }
        .guide b { color: var(--ink); font-weight: 600; }

        /* 中央密码卡 */
        .gate-wrap {

        .gate-input {

        .gate-input:focus {

        }
        .gate-btn {

        .gate-error { color: #D4722E; font-size: 0.8rem; line-height: 1.4; min-height: 1.15em; margin-top: 0.6rem; }
        .gate-note { margin-top: 0.7rem; color: var(--ink-soft); font-size: 0.71rem; line-height: 1.7; }

        /* 3D 锚点标签（JS 投影定位） */
        .pill {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 15;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 13px 8px 9px;
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 15px;
            background: rgba(255, 253, 248, 0.94);
            color: var(--ink);
            box-shadow: 0 10px 26px rgba(90, 74, 44, 0.15), inset 0 1px 0 rgba(255,255,255,0.7);
            cursor: pointer;
            will-change: transform;
            transition: background .2s, box-shadow .2s, opacity .35s;
        }
        .pill::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -5px;
            margin-left: -5px;
            width: 9px; height: 9px;
            background: inherit;
            border-right: 1px solid rgba(255, 255, 255, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.85);
            transform: rotate(45deg);
            border-bottom-right-radius: 2px;
        }
        .pill .n {
            width: 28px; height: 28px;
            border-radius: 9px;
            background: linear-gradient(135deg, #F3BB84, #E08B5A);
            color: #fff;
            font-size: 0.86rem;
            font-weight: 700;

        .pill:hover { background: #fffdf8; box-shadow: 0 14px 30px rgba(90, 74, 44, 0.22); }
        .pill:hover .n { transform: scale(1.07) rotate(-4deg); }
        .pill.on {
            background: #fffdf8;
            border-color: rgba(232, 168, 124, 0.85);
            box-shadow: 0 14px 34px rgba(224, 139, 90, 0.3), 0 0 0 3px rgba(232, 168, 124, 0.16);
        }

        /* 底部时间轴 */
        .stepper {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%) translateY(8px);
            z-index: 16;
            width: min(880px, calc(100vw - 120px));
            padding: 9px 20px 13px;
            border-radius: 17px;
            background: var(--glass);
            backdrop-filter: blur(14px) saturate(1.1);
            -webkit-backdrop-filter: blur(14px) saturate(1.1);
            border: 1px solid var(--glass-line);
            box-shadow: var(--shadow);
            opacity: 0;
            transition: opacity .5s ease, transform .5s ease;
        }
        .stepper.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .stepper-head {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.66rem;

            color: var(--ink-soft);

        .stepper-head .sep { opacity: .45; }

        .steps { position: relative; display: flex; align-items: flex-start; }
        .step {
            position: relative;
            flex: 0 0 auto;
            width: 62px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--ink-soft);
            font-family: inherit;
            padding: 0;
        }
        .step i {
            width: 24px; height: 24px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 0.68rem;
            font-style: normal;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.7);
            border: 1px dashed rgba(160, 142, 118, 0.6);
            color: var(--ink-soft);
            transition: all .25s;
        }
        .step em {
            font-style: normal;
            font-size: 0.66rem;
            letter-spacing: 0.6px;
            white-space: nowrap;
            transition: color .25s;
        }
        .step:hover i { border-color: var(--roof-deep); color: var(--roof-deep); }
        .step:hover em { color: var(--ink); }
        .step.on i {
            background: linear-gradient(135deg, #F3BB84, #E08B5A);
            border: 1px solid transparent;
            color: #fff;
            box-shadow: 0 4px 12px rgba(224, 139, 90, 0.42);
            transform: scale(1.08);
        }
        .step.on em { color: var(--ink); font-weight: 600; }

        .step-line {
            flex: 1 1 auto;
            height: 1px;
            margin-top: 12px;
            border-top: 1px dashed rgba(160, 142, 118, 0.45);
            min-width: 8px;
        }

        .pencil {
            position: absolute;
            bottom: -9px;
            z-index: 3;
            pointer-events: none;
            left: 0;
            width: 15px;
            height: 15px;
            color: var(--roof-deep);
            transform: translateX(-50%) rotate(-14deg);
            transition: left .45s cubic-bezier(.4, 0, .2, 1);

        }
        .pencil.show { opacity: 1; }
        .pencil svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

        /* 入场动画 */
        .gate-card, .brand, .guide {
            opacity: 0;
            animation: fadeIn .9s ease forwards;

        .brand { animation-delay: .1s; }
        .guide { animation-delay: .25s; }
        .gate-card { animation-delay: .3s; }
        @keyframes fadeIn { to { opacity: 1; } }

        .gate-card.leaving {
            animation: none; /* 关掉入场动画，否则其 forwards 填充会盖住淡出 */
            transition: opacity .45s ease, transform .45s ease;
            opacity: 0;
            transform: scale(.9) translateY(-8px);
        }
        .pill.hide, .brand.hide, .guide.hide, .stepper.hide {
            animation: none; /* 同上：入场动画的 forwards 会盖住淡出 */
            transition: opacity .45s ease;
            opacity: 0;
            pointer-events: none;

        @media (max-width: 860px) {

            .stepper { width: calc(100vw - 88px); bottom: 12px; padding: 7px 12px 11px; }
            .stepper-head { display: none; }
            .step { width: 46px; }
            .step i { width: 20px; height: 20px; font-size: 0.6rem; }
            .step em { font-size: 0.56rem; letter-spacing: 0; }
            .step-line { margin-top: 10px; }

        .env {

        .env-row { display: flex; gap: 3px; margin-bottom: 9px; }
        .env button {

        .env button:hover { background: rgba(217, 194, 155, .4); color: var(--ink); }
        .env button.on { background: var(--roof); color: #fff; }
        .env button:focus-visible, .env input:focus-visible { outline: 2px solid var(--roof-deep); outline-offset: 2px; }
        .env-time { display: flex; align-items: center; gap: 10px; }
        .env-time span { width: 2.8em; color: var(--ink); font-weight: 600; }
        .env-time input { flex: 1; min-width: 120px; height: 18px; accent-color: var(--roof-deep); cursor: pointer; }
        @media (max-width: 860px) { .env { display: none; } }
    </style>

    <!-- 认证逻辑：与 gate.js 保持一致（djb2 哈希 + 4 小时 / 每日失效） -->
    <script>
        (function () {
            var GATE_HASH = '7c7c2e23'; // 密码 7896 的 djb2 哈希
            var STORAGE_KEY = 'bc_site_pass';
            var MAX_AGE = 4 * 60 * 60 * 1000;

            function hashPin(s) {
                var h = 5381;
                for (var i = 0; i < s.length; i++) {
                    h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
                }
                return h.toString(16);
            }
            function isSameDay(a, b) {
                var d1 = new Date(a), d2 = new Date(b);
                return d1.getFullYear() === d2.getFullYear() &&
                    d1.getMonth() === d2.getMonth() &&
                    d1.getDate() === d2.getDate();
            }
            function isGranted() {
                try {
                    var t = parseInt(localStorage.getItem(STORAGE_KEY), 10);
                    if (!t) return false;
                    return (Date.now() - t < MAX_AGE) && isSameDay(t, Date.now());
                } catch (e) { return false; }
            }
            function getNext() {
                var next = new URLSearchParams(location.search).get('next');
                if (!next) return 'index.html';
                try {
                    var u = new URL(next, location.origin);
                    if (u.origin === location.origin && !/^(javascript|data|vbscript):/i.test(next)) return next;
                } catch (e) {}
                return 'index.html';
            }

            var input = document.getElementById('gate-input');
            var btn = document.getElementById('gate-btn');
            var err = document.getElementById('gate-error');
            var card = document.getElementById('gate-card');

            // 已放行则直接回跳，不展示密码门
            if (isGranted()) {
                location.replace(getNext());
                return;
            }

            function allow() {
                try { localStorage.setItem(STORAGE_KEY, String(Date.now())); } catch (e) {}
                card.classList.add('leaving');
                document.querySelectorAll('.pill, .brand, .guide, .stepper').forEach(function (el) {
                    el.classList.add('hide');
                });
                var st = document.getElementById('stepper-state');
                if (st) st.textContent = '解锁成功，正在进入';
                // 镜头推近沙盘做收尾
                if (window.__gate3d && window.__gate3d.celebrate) window.__gate3d.celebrate();
                setTimeout(function () { location.replace(getNext()); }, 1000);
            }
            function deny() {
                err.textContent = '密码不正确，请重试';
                input.value = '';
                input.focus();
                card.animate(
                    [{ transform: 'translateX(0)' }, { transform: 'translateX(-9px)' }, { transform: 'translateX(9px)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }],
                    { duration: 340, easing: 'ease-in-out' }
                );
            }
            function check() {

                    if (style === 'office') {
                        // 写字楼：退台 + 天线，体量更瘦高
                        const tier = box(w * 0.64, h * 0.20, d * 0.64, color);
                        tier.position.y = h + h * 0.10;
                        tier.castShadow = false; tier.receiveShadow = false;
                        g.add(tier);
                        const ant = cyl(0.03, 0.05, 1.1, M.wallDark, 6);
                        ant.position.y = h + h * 0.20 + 0.55;
                        g.add(ant);
                    } else if (style === 'resid') {
                        // 住宅：阳台横带
                        const bands = Math.max(2, Math.floor(h / 2.4));
                        for (let b = 1; b <= bands; b++) {
                            const band = box(w + 0.16, 0.07, d + 0.16, M.wallDark);
                            band.position.y = (h / (bands + 1)) * b;
                            band.castShadow = false; band.receiveShadow = false;
                            g.add(band);
                        }
                    } else if (style === 'shop') {
                        // 商业：低矮宽体 + 顶部招牌 + 一层雨棚
                        const sign = box(w + 0.2, 0.46, 0.06, M.screen);
                        sign.position.set(0, h - 0.42, d / 2 + 0.06);
                        sign.castShadow = false; sign.receiveShadow = false;
                        g.add(sign);
                        const awn = box(w + 0.34, 0.05, 0.62, M.roof);
                        awn.position.set(0, 0.62, d / 2 + 0.33);
                        awn.castShadow = false; awn.receiveShadow = false;
                        g.add(awn);
                    }

                    // 窗户网格：按高度铺行，每行 w/0.7 个左右
                    const rows = Math.max(3, Math.floor(h / 1.2));
                    const cols = Math.max(2, Math.floor(w / 0.7));
                    const winW = 0.28, winH = 0.38;
                    // 远处的楼降低窗户密度，控制绘制批次
                    const skipProb = Math.hypot(x, z) > 40 ? 0.88 : Math.hypot(x, z) > 27 ? 0.76 : 0.52;   // 楼变多了，窗户适当减少控制批次
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            if (crng() < skipProb) continue; // 随机留空，窗户不是满铺
                            const wx = -w / 2 + 0.35 + c * (w - 0.7) / Math.max(1, cols - 1);
                            const wy = 0.6 + r * 1.2;
                            if (wy > h - 0.3) continue;
                            const front = box(winW, winH, 0.02, M.windowLight);
                            front.position.set(wx, wy, d / 2 + 0.01);
                            front.castShadow = false; front.receiveShadow = false;
                            g.add(front);
                            cityWindowMats.push(front.material);
                            const back = box(winW, winH, 0.02, M.windowLight);
                            back.position.set(wx, wy, -d / 2 - 0.01);
                            back.castShadow = false; back.receiveShadow = false;
                            g.add(back);
                            cityWindowMats.push(back.material);
                        }
                    }

                    // 屋顶样式
                    if (roofStyle === 0) {
                        // 平顶 + 小机房
                        const top = box(w * 0.35, 0.5, d * 0.35, M.wallDark);
                        top.position.y = h + 0.25;
                        top.castShadow = false; top.receiveShadow = false;
                        g.add(top);
                    } else if (roofStyle === 1) {
                        // 尖塔顶
                        const tip = cone(0.18, 1.2, M.ink, 6);
                        tip.position.y = h + 0.6;
                        tip.castShadow = false; tip.receiveShadow = false;
                        g.add(tip);
                    } else {
                        // 女儿墙
                        const parapet = box(w + 0.08, 0.28, 0.18, M.wallDark);
                        parapet.position.set(0, h + 0.14, d / 2);
                        parapet.castShadow = false; parapet.receiveShadow = false;
                        g.add(parapet);
                        const parapet2 = box(w + 0.08, 0.28, 0.18, M.wallDark);
                        parapet2.position.set(0, h + 0.14, -d / 2);
                        parapet2.castShadow = false; parapet2.receiveShadow = false;
                        g.add(parapet2);
                    }

                    // —— 造型变化：L 形侧翼 / 四坡屋顶 / 退台 / 圆塔 ——
                    if (style !== 'office') {
                        const vr = crng();
                        const alt = palette[Math.floor(crng() * palette.length)];
                        let extra = null;
                        if (vr < 0.18) {
                            const wh = h * cr(0.45, 0.7);
                            extra = box(w * 0.55, wh, d * 0.62, alt);
                            extra.position.set((crng() < 0.5 ? -1 : 1) * (w * 0.5 + 0.2), wh / 2, d * 0.18);
                        } else if (vr < 0.34) {
                            extra = cone(Math.max(w, d) * 0.76, 1.5, M.roofB, 4);
                            extra.rotation.y = Math.PI / 4;
                            extra.position.y = h + 0.75;
                        } else if (vr < 0.5) {
                            extra = box(w * 0.7, h * 0.3, d * 0.7, alt);
                            extra.position.y = h + h * 0.15;
                        } else if (vr < 0.62) {
                            const r = Math.min(w, d) * 0.3;
                            extra = cyl(r, r, 1.1, alt, 12);
                            extra.position.set(w * 0.28, h + 0.55, d * 0.2);
                        }
                        if (extra) { extra.castShadow = false; extra.receiveShadow = false; g.add(extra); }
                    }

                    g.position.set(x, -0.15, z); // 放在大地平面上（y=-0.15）
                    g.userData.clickable = { type: 'city' };
                    cityRoot.add(g);
                    return g;
                }

                // 城市配色：蓝灰、米灰、浅棕、砖红四种
                const palette = [
                    new THREE.MeshStandardMaterial({ color: 0xBCC4CE, roughness: 0.7 }),
                    new THREE.MeshStandardMaterial({ color: 0xD4CDBE, roughness: 0.75 }),
                    new THREE.MeshStandardMaterial({ color: 0xA89080, roughness: 0.7 }),
                    new THREE.MeshStandardMaterial({ color: 0xC4756A, roughness: 0.8 }),
                    new THREE.MeshStandardMaterial({ color: 0x8FA0AD, roughness: 0.65 })
                ];
                // 写字楼：冷调玻璃感灰蓝，体量高、颜色统一
                const palOffice = [
                    new THREE.MeshStandardMaterial({ color: 0x9FB0C0, roughness: 0.55, metalness: 0.16 }),
                    new THREE.MeshStandardMaterial({ color: 0xB3BEC9, roughness: 0.55, metalness: 0.14 }),
                    new THREE.MeshStandardMaterial({ color: 0x8FA3B8, roughness: 0.6, metalness: 0.18 }),
                    new THREE.MeshStandardMaterial({ color: 0xC9D2DA, roughness: 0.6, metalness: 0.12 })
                ];
                // 商业街：暖色低矮店面，颜色偏饱和
                const palShop = [
                    new THREE.MeshStandardMaterial({ color: 0xD9A05B, roughness: 0.78 }),
                    new THREE.MeshStandardMaterial({ color: 0xCE7A6A, roughness: 0.78 }),
                    new THREE.MeshStandardMaterial({ color: 0x8FB58A, roughness: 0.78 }),
                    new THREE.MeshStandardMaterial({ color: 0xD6C68A, roughness: 0.78 })
                ];

                // 外围楼群：按网格程序化布点，避让马路 / 湖面 / 小山，
                // 由内向外占位，让沙盘四周形成成片的楼群而不是零星几栋
                const hillAvoid = [
                    { x: -38, z: -28, r: 9 }, { x: 35, z: 28, r: 7 },
                    { x: -40, z: 30, r: 11 }, { x: 44, z: 4, r: 8 },
                    { x: -28, z: -42, r: 6 }
                ];
                // 学校 + 操场预留地块：先把这块地圈出来，普通楼群不许占（留出围栏外的走道余量）
                const SCHOOL_ZONE = { x1: 19.8, x2: 34.6, z1: -7.0, z2: 7.0 };
                const placed = [];
                const cells = [];
                for (let gx = -57; gx <= 57; gx += 2.8) {
                    for (let gz = -51; gz <= 51; gz += 2.8) {
                        cells.push({ x: gx, z: gz });
                    }
                }
                // 由内向外占位：靠近沙盘的格子优先放楼
                cells.sort(function (a, b) {
                    return Math.hypot(a.x, a.z) - Math.hypot(b.x, b.z);
                });

                cells.forEach(function (cell) {
                    if (placed.length >= 650) return;
                    const x = cell.x + cr(-0.12, 0.12);
                    const z = cell.z + cr(-0.12, 0.12);
                    // 沙盘本体：留出人行道与公园
                    if (Math.hypot(x / 17.8, z / 13.8) < 1.02 || (Math.abs(x) < 17.5 && Math.abs(z) < 13.4)) return;
                    // 学校 + 操场预留地
                    if (x > SCHOOL_ZONE.x1 && x < SCHOOL_ZONE.x2 &&
                        z > SCHOOL_ZONE.z1 && z < SCHOOL_ZONE.z2) return;
                    // 马路（含路缘退让）
                    if (Math.abs(z - 13.4) < 2.6 || Math.abs(z + 13.4) < 2.6) return;
                    if (Math.abs(x - 17.5) < 2.6 || Math.abs(x + 17.5) < 2.6) return;
                    // 湖面
                    if (Math.abs(x) < 8.5 && Math.abs(z - 19.6) < 5.8) return;
                    for (let i = 0; i < CITY_KEEP.length; i++) {
                        const k = CITY_KEEP[i];
                        if (x > k[0] - 2.4 && x < k[1] + 2.4 && z > k[2] - 2.4 && z < k[3] + 2.4) return;
                    }
                    // 机场预留地（东北）+ 铁路/高铁站预留（南侧）
                    if (x > 32 && x < 59 && z > -35 && z < -18) return;
                    if (Math.abs(x) < 53 && z > 40.5 && z < 51.5) return;
                    // 小山
                    for (let i = 0; i < hillAvoid.length; i++) {
                        const hv = hillAvoid[i];
                        if (Math.hypot(x - hv.x, z - hv.z) < hv.r + 3) return;
                    }
                    // 分区：北侧外围是写字楼区，东西两侧沿街是商业区，其余为住宅区
                    let style = 'resid';
                    if (z < -17) style = 'office';
                    else if (Math.abs(x) > 20.5) style = 'shop';
                    // 外形跟着分区走：写字楼瘦高、商业宽扁、住宅常规
                    const w = cr(2.1, 2.6);   // 地块 2.8，楼体留 0.2~0.7 的小巷
                    const d = cr(2.0, 2.5);
                    // 与已放置的楼保持间距，避免楼体互相穿插
                    for (let i = 0; i < placed.length; i++) {
                        const p = placed[i];
                        if (Math.abs(x - p.x) < (w + p.w) / 2 + 0.15 &&
                            Math.abs(z - p.z) < (d + p.d) / 2 + 0.15) return;
                    }
                    let h = cr(4.5, 10.5);
                    if (style === 'office') h = cr(9.5, 15.5);          // 写字楼拉高天际线
                    else if (style === 'shop') h = cr(2.8, 4.6);        // 商业压低，形成沿街低层带
                    else if (crng() < 0.22) h += cr(3.5, 6.5);          // 住宅少量高楼
                    h *= 1 + Math.min(0.5, Math.max(0, Math.hypot(x, z) - 22) / 70);   // 越往外越高，天际线更像市区
                    let col;
                    if (style === 'office') col = palOffice[Math.floor(crng() * palOffice.length)];
                    else if (style === 'shop') col = palShop[Math.floor(crng() * palShop.length)];
                    else col = palette[Math.floor(crng() * palette.length)];
                    const roof = style === 'office' ? 0 : Math.floor(crng() * 3);
                    placed.push({ x: x, z: z, w: w, d: d });
                    cityBuilding(x, z, w, d, h, col, roof, style);
                });

                // 把窗户材质挂到 world 上，后面昼夜循环统一控制
                world.userData.cityWindowMats = cityWindowMats;
                // 楼体范围暴露出去，环湖种树时用来避让
                world.userData.cityBuildings = placed;

                // 楼多了以后逐个网格会拖垮帧率：按材质合并成十几个网格（失败则保留原样）
                (async function mergeCity() {
                    try {
                        const { mergeGeometries } = await import('three/addons/utils/BufferGeometryUtils.js');
                        cityRoot.updateMatrixWorld(true);
                        const inv = cityRoot.matrixWorld.clone().invert();
                        const buckets = new Map(), olds = [];
                        cityRoot.traverse(function (o) {
                            if (!o.isMesh) return;
                            const g = o.geometry.clone();
                            g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));
                            let b = buckets.get(o.material.uuid);
                            if (!b) buckets.set(o.material.uuid, b = { m: o.material, gs: [] });
                            b.gs.push(g);
                            olds.push(o.geometry);
                        });
                        const merged = new THREE.Group();
                        merged.userData.clickable = { type: 'city' };
                        buckets.forEach(function (b) {
                            const geo = mergeGeometries(b.gs, false);
                            b.gs.forEach(function (g) { g.dispose(); });
                            if (!geo) return;
                            const mm = new THREE.Mesh(geo, b.m);
                            mm.castShadow = false; mm.receiveShadow = false; mm.frustumCulled = false;
                            merged.add(mm);
                        });
                        world.add(merged);
                        world.remove(cityRoot);
                        olds.forEach(function (g) { g.dispose(); });
                    } catch (err) { console.warn('[gate3d] 楼群合并失败，保持逐个渲染', err); }
                })();
            })();

            // 环湖树林：沿湖岸外沿成片种树，围出一小片林地
            (function lakeForest() {
                const LAKE = { x: 0, z: 19.6 };
                const RX = 4.8, RZ = 2.2;   // 与湖面 geo 的基准半径保持一致
                const buildings = world.userData.cityBuildings || [];
                // 与湖面 geo 同一套多频扰动，保证树的落点贴着真实岸线
                function outline(a, scale) {
                    const amp = 0.10;
                    return scale * (1
                        + amp * Math.sin(a * 3 + 0.9)
                        + amp * 0.55 * Math.sin(a * 5 + 2.4)
                        + amp * 0.30 * Math.cos(a * 7 + 1.1));
                }
                function hitBuilding(x, z) {
                    for (let i = 0; i < buildings.length; i++) {
                        const b = buildings[i];
                        if (Math.abs(x - b.x) < b.w / 2 + 1.0 &&
                            Math.abs(z - b.z) < b.d / 2 + 1.0) return true;
                    }
                    return false;
                }
                const grng = rng(20261119);
                let count = 0;
                for (let i = 0; i < 320 && count < 52; i++) {
                    const a = grng() * Math.PI * 2;
                    const f = outline(a, 1.30);          // 湖岸走道的外沿
                    const k = 1.10 + grng() * 0.78;      // 向外再推 10%~88%
                    const x = LAKE.x + Math.cos(a) * f * k * RX;
                    const z = LAKE.z + Math.sin(a) * f * k * RZ;
                    // 马路（含人行道退让）：靠路一侧留空，不种到路面上
                    if (Math.abs(z - 13.4) < 3.6) continue;
                    if (Math.abs(Math.abs(x) - 17.5) < 3.6) continue;
                    // 不压到楼体
                    if (hitBuilding(x, z)) continue;
                    const tg = tree(x, z, 0.78 + grng() * 0.8, Math.floor(grng() * 3));
                    tg.position.y = -0.15;   // 沙盘外是大地面，树根要落回地面
                    count++;
                }
            })();

            // 外围远景：3 座小山 + 1 个湖
            (function landscape() {
                // 湖：沙盘正南侧。外轮廓多频扰动，避免死板的长方形；
                // 走道 / 湖岸 / 水面做成互不重叠的同心环，不再叠在一起
                const LAKE = { x: 0, z: 19.6 };
                function lakeRing(sx, sz, amp, scale, reverse) {
                    const pts = [];
                    const N = 56;
                    for (let i = 0; i < N; i++) {
                        const a = (i / N) * Math.PI * 2;
                        const rr = scale * (1
                            + amp * Math.sin(a * 3 + 0.9)
                            + amp * 0.55 * Math.sin(a * 5 + 2.4)
                            + amp * 0.30 * Math.cos(a * 7 + 1.1));
                        pts.push(new THREE.Vector2(Math.cos(a) * rr * sx, Math.sin(a) * rr * sz));
                    }
                    if (reverse) pts.reverse();
                    return pts;
                }
                function lakeGeo(sx, sz, amp, outerScale, innerScale) {
                    const shape = new THREE.Shape(lakeRing(sx, sz, amp, outerScale, false));
                    if (innerScale) shape.holes.push(new THREE.Path(lakeRing(sx, sz, amp, innerScale, true)));
                    const g = new THREE.ShapeGeometry(shape);
                    g.rotateX(-Math.PI / 2);
                    return g;
                }
                // 注意：地面在 y = -0.15，湖面必须高于它，否则会被地面盖住看不见
                const LY = -0.10;
                const lakePath = mesh(lakeGeo(4.8, 2.2, 0.10, 1.30, 1.13), M.walk, false);
                lakePath.position.set(LAKE.x, LY, LAKE.z);
                lakePath.receiveShadow = false;
                world.add(lakePath);
                const lakeBank = mesh(lakeGeo(4.8, 2.2, 0.10, 1.13, 1.0), M.waterBank, false);
                lakeBank.position.set(LAKE.x, LY, LAKE.z);
                lakeBank.receiveShadow = false;
                world.add(lakeBank);
                const lakeWater = mesh(lakeGeo(4.8, 2.2, 0.10, 1.0, 0), M.water, false);
                lakeWater.position.set(LAKE.x, LY - 0.006, LAKE.z);
                lakeWater.receiveShadow = false;
                lakeWater.userData.clickable = { type: 'lake', ref: lakeWater };
                world.add(lakeWater);

                // 小山：用压扁的 cone + sphere，放城市楼更远的地方
                const hillSpecs = [
                    { x: -38, z: -28, h: 4.5, r: 9,  s: 'cone' },
                    { x: 35,  z: 28,  h: 3.2, r: 7,  s: 'sphere' },
                    { x: -40, z: 30,  h: 5.2, r: 11, s: 'cone' },
                    { x: 44,  z: 4,   h: 3.8, r: 8,  s: 'sphere' },
                    { x: -28, z: -42, h: 2.8, r: 6,  s: 'cone' }
                ];
                const hillMat1 = mat(0x6FA86F);
                const hillMat2 = mat(0x7FB77F);
                hillSpecs.forEach(function (h) {
                    const g = new THREE.Group();
                    if (h.s === 'cone') {
                        const body = cone(h.r, h.h, hillMat1, 12);
                        body.position.y = h.h / 2;
                        body.castShadow = false; body.receiveShadow = false;
                        g.add(body);
                        // 山顶留点草/树
                        const cap = sph(h.r * 0.45, hillMat2);
                        cap.position.y = h.h - 0.3;
                        cap.scale.y = 0.5;
                        cap.castShadow = false; cap.receiveShadow = false;
                        g.add(cap);
                    } else {
                        const body = sph(h.r, hillMat1);
                        body.scale.y = h.h / h.r * 0.6;
                        body.position.y = h.h * 0.3;
                        body.castShadow = false; body.receiveShadow = false;
                        g.add(body);
                    }
                    g.position.set(h.x, -0.15, h.z);
                    world.add(g);
                });
            })();

            // 湖中鱼群：贴着水面游动，错峰跃起并在入水处荡开小水环
            const lakeFish = (function () {
                const WATER_Y = -0.106;
                const fishes = [];
                const eyeWhite = mat(0xFFFFFF, { roughness: 0.5 });
                const specs = [
                    { x: -1.65, z: 19.15, color: 0xF2A65A, period: 6.4, phase: 0.0, speed: 0.55, height: 0.95, rx: 0.46, rz: 0.24 },
                    { x: 0.10, z: 18.85, color: 0xF7E7C8, period: 7.1, phase: 2.2, speed: 0.45, height: 0.75, rx: 0.52, rz: 0.25 },
                    { x: 1.75, z: 19.65, color: 0xE98C91, period: 7.8, phase: 4.1, speed: 0.50, height: 1.10, rx: 0.44, rz: 0.28 },
                    { x: -0.80, z: 20.35, color: 0x70B7C9, period: 8.3, phase: 1.2, speed: 0.40, height: 0.85, rx: 0.48, rz: 0.24 },
                    { x: 1.00, z: 20.55, color: 0xE8C85C, period: 6.9, phase: 5.0, speed: 0.52, height: 0.72, rx: 0.42, rz: 0.22 }
                ];

                specs.forEach(function (s) {
                    const g = new THREE.Group();
                    const fishMat = mat(s.color, { roughness: 0.55 });
                    const body = sph(0.25, fishMat, 12);
                    body.scale.set(1.45, 0.62, 0.58);
                    g.add(body);

                    const tailPivot = new THREE.Group();
                    tailPivot.position.x = -0.30;
                    const tail = cone(0.17, 0.27, fishMat, 3);
                    tail.position.x = -0.10;
                    tail.rotation.z = -Math.PI / 2;
                    tailPivot.add(tail);
                    g.add(tailPivot);

                    const fin = cone(0.075, 0.16, fishMat, 3);
                    fin.position.set(-0.04, 0.15, 0);
                    g.add(fin);
                    [-1, 1].forEach(function (side) {
                        g.add(putFishPart(sph(0.035, eyeWhite, 8), 0.22, 0.055, side * 0.105));
                        g.add(putFishPart(sph(0.017, M.ink, 8), 0.242, 0.060, side * 0.125));
                    });
                    g.traverse(function (o) {
                        if (o.isMesh) { o.castShadow = false; o.receiveShadow = false; }
                    });
                    world.add(g);

                    const splashMat = new THREE.MeshBasicMaterial({
                        color: 0xE8FAFF, transparent: true, opacity: 0.12,
                        depthWrite: false, side: THREE.DoubleSide
                    });
                    const splash = mesh(new THREE.RingGeometry(0.13, 0.18, 24), splashMat, false);
                    splash.rotation.x = -Math.PI / 2;
                    splash.position.set(s.x, WATER_Y + 0.012, s.z);
                    splash.renderOrder = 4;
                    world.add(splash);
                    fishes.push(Object.assign({ g: g, tailPivot: tailPivot, splash: splash, duration: 1.35 }, s));
                });

                function putFishPart(o, x, y, z) {
                    o.position.set(x, y, z);
                    return o;
                }

                function update(dt, t) {
                    fishes.forEach(function (f) {
                        const swim = t * f.speed + f.phase;
                        const x = f.x + Math.cos(swim) * f.rx;
                        const z = f.z + Math.sin(swim) * f.rz;
                        const dx = -Math.sin(swim) * f.rx * f.speed;
                        const dz = Math.cos(swim) * f.rz * f.speed;
                        const phase = (t + f.phase) % f.period;
                        const jumping = phase < f.duration;
                        let y = WATER_Y - 0.045;
                        let pitch = 0;
                        let splashStrength = 0;

                    });
                    const back = box(1.56, 0.72, 0.05, frame);
                    back.position.set(0, 0.5, -0.62);
                    back.castShadow = false;
                    g.add(back);
                    const seat = box(1.5, 0.05, 0.3, M.wood);
                    seat.position.set(0, 0.3, -0.42);
                    seat.castShadow = false;
                    g.add(seat);
                    g.traverse(function (o) { o.castShadow = false; });
                    return g;
                }
                function adBoard(color) {
                    const g = new THREE.Group();
                    const m = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.35, roughness: 0.5 });
                    [-0.28, 0.28].forEach(function (x) {
                        const leg = cyl(0.025, 0.025, 0.5, mat(0x555555, { roughness: 0.6 }), 6);
                        leg.position.set(x, 0.25, 0);

                    });

                    panel.castShadow = false;
                    g.add(panel);
                    g.traverse(function (o) { o.castShadow = false; });

                }
                function stopSign() {
                    const g = new THREE.Group();
                    const pole = cyl(0.028, 0.028, 0.85, M.ink, 6);
                    pole.position.y = 0.42;
                    pole.castShadow = false;
                    g.add(pole);
                    const board = box(0.34, 0.24, 0.05, mat(0x2E6FB0, { roughness: 0.5 }));
                    board.position.y = 0.95;
                    board.castShadow = false;
                    g.add(board);
                    g.traverse(function (o) { o.castShadow = false; });
                    return g;
                }
                function trashCan() {
                    const g = new THREE.Group();
                    const body = cyl(0.16, 0.13, 0.5, mat(0x6E7A66, { roughness: 0.8 }), 12);
                    body.position.y = 0.25;
                    body.castShadow = false;
                    g.add(body);
                    const lid = cyl(0.17, 0.17, 0.06, mat(0x555B52, { roughness: 0.7 }), 12);
                    lid.position.y = 0.53;
                    lid.castShadow = false;
                    g.add(lid);
                    g.traverse(function (o) { o.castShadow = false; });

                }
                function roadSign() {
                    const g = new THREE.Group();
                    const pole = cyl(0.03, 0.03, 1.3, M.ink, 6);
                    pole.position.y = 0.65;
                    pole.castShadow = false;
                    g.add(pole);
                    const board = box(0.62, 0.34, 0.05, mat(0x2E6FB0, { roughness: 0.5 }));
                    board.position.y = 1.35;
                    board.castShadow = false;
                    g.add(board);
                    const border = box(0.66, 0.38, 0.03, M.white);
                    border.position.y = 1.35;
                    border.castShadow = false;
                    g.add(border);
                    g.traverse(function (o) { o.castShadow = false; });

                }

                /* —— 候车人 —— */
                const waitShirts = [mat(0xE86A5C), mat(0x6E9BC7), mat(0xE9C46A), mat(0x8FBF7F), mat(0xC79BE0), mat(0xE39B6B)];
                let shirtIdx = 0;
                function makeWaiter() {
                    const g = person(0, 0, waitShirts[shirtIdx++ % waitShirts.length]);
                    g.position.y = SWY;
                    g.rotation.y = 0;
                    return { g: g };
                }

                /* —— 公交线路：沿外围矩形顺时针绕行 —— */
                const route = [
                    { edge: 'top', dir: 1 },     // NW → NE
                    { edge: 'right', dir: 1 },   // NE → SE
                    { edge: 'bottom', dir: -1 }, // SE → SW
                    { edge: 'left', dir: -1 }    // SW → NW
                ];

                /* —— 四个站台（内圈人行道） —— */
                const stops = [];
                const STOP_DEFS = [
                    { cx: 0,    cz: -11.4, nx: 0,  nz: -1 },
                    { cx: 15.5, cz: 0,     nx: 1,  nz: 0 },
                    { cx: 0,    cz: 11.4,  nx: 0,  nz: 1 },
                    { cx: -15.5, cz: 0,    nx: -1, nz: 0 }
                ];
                function spotVec(stop, i) {
                    return new THREE.Vector3(
                        stop.cx + stop.tx * (-1.1 - i * 0.5),
                        SWY,
                        stop.cz + stop.tz * (-1.1 - i * 0.5)
                    );
                }
                STOP_DEFS.forEach(function (d) {
                    const tx = -d.nz, tz = d.nx;   // 切线方向（沿人行道）
                    const rotY = Math.atan2(d.nx, d.nz);
                    const stop = { cx: d.cx, cz: d.cz, tx: tx, tz: tz, rotY: rotY,
                        queue: [], boarding: false, boardT: 0, boarder: null, alighter: null, doorVec: new THREE.Vector3() };
                    const sh = shelter();
                    sh.position.set(d.cx, SURF, d.cz);
                    sh.rotation.y = rotY;
                    world.add(sh);
                    const ad = adBoard(adColors[Math.floor(rand() * adColors.length)]);
                    ad.position.set(d.cx + tx * 1.9, SURF, d.cz + tz * 1.9);
                    ad.rotation.y = rotY;
                    world.add(ad);
                    const sign = stopSign();
                    sign.position.set(d.cx + tx * 1.3, SURF, d.cz + tz * 1.3);
                    sign.rotation.y = rotY;
                    world.add(sign);
                    for (let i = 0; i < 2; i++) {
                        const w = makeWaiter();
                        w.g.position.copy(spotVec(stop, i));
                        w.g.rotation.y = rotY;
                        stop.queue.push(w);
                    }
                    stops.push(stop);
                });

                /* —— 多辆公交：普通公交 + 红色双层观光巴士 + 长途大巴 —— */
                const buses = [];
                function spawnBus(model, segStart, speed, express, initT) {
                    const e = traffic.EDGES[route[segStart].edge];
                    let h = e.heading + (route[segStart].dir === -1 ? Math.PI : 0);
                    if (h > Math.PI) h -= Math.PI * 2;
                    if (h < -Math.PI) h += Math.PI * 2;
                    buses.push({ g: model, seg: segStart, t: (initT === undefined ? 0.2 : initT), speed: speed,
                        dwelled: false, state: 'drive', dwellT: 0, heading: h, express: !!express });
                }
                spawnBus(bus(busColors[0]), 0, 2.4);
                spawnBus(bus(busColors[1]), 2, 2.4);
                spawnBus(doubleDecker(0xC0392B), 1, 2.2);    // 红色开放上层双层巴士
                spawnBus(coach(0xE8EAF0), 3, 3.1, true);     // 长途大巴：不停站直行
                spawnBus(tram(0x2E7D5B), 0, 2.6, false, 0.5); // 大连复古有轨电车
                world.userData.busList = { buses: buses, route: route };

                /* —— 有轨电车架空接触网：电线杆 + 悬索线（沿外环道路） —— */
                (function buildCatenary() {
                    const CAT_Y = 2.42;                                  // 悬索线高度（受电弓上方）
                    const catWireMat = mat(0x2E3338, { roughness: 0.4, metalness: 0.35 });
                    const catPoleMat = mat(0x3A4550, { roughness: 0.6 });
                    function wireX(z, from, to) {                        // 沿 x 的悬索线
                        const o = box(Math.abs(to - from), 0.035, 0.035, catWireMat);
                        o.position.set((from + to) / 2, CAT_Y, z);
                        o.castShadow = false;
                        world.add(o);
                    }
                    function wireZ(x, from, to) {                        // 沿 z 的悬索线
                        const o = box(0.035, 0.035, Math.abs(to - from), catWireMat);
                        o.position.set(x, CAT_Y, (from + to) / 2);
                        o.castShadow = false;
                        world.add(o);
                    }
                    function poleAt(alongX, p, sideCoord, wireCoord) {   // 杆 + 横臂 + 吊线
                        const px = alongX ? p : sideCoord;
                        const pz = alongX ? sideCoord : p;
                        const pole = cyl(0.045, 0.08, 3.6, catPoleMat, 8);
                        pole.position.set(px, 1.8, pz);
                        pole.castShadow = false;
                        world.add(pole);
                        const armLen = Math.abs(sideCoord - wireCoord);
                        const arm = box(alongX ? 0.05 : armLen, 0.05, alongX ? armLen : 0.05, catPoleMat);
                        arm.position.set(alongX ? p : (sideCoord + wireCoord) / 2, 3.4, alongX ? (sideCoord + wireCoord) / 2 : p);
                        arm.castShadow = false;
                        world.add(arm);
                        const drop = cyl(0.02, 0.02, 3.4 - CAT_Y, catWireMat, 5);
                        drop.position.set(alongX ? p : wireCoord, (3.4 + CAT_Y) / 2, alongX ? wireCoord : p);
                        drop.castShadow = false;
                        world.add(drop);
                    }
                    const hxPoles = [-36, -30, -24, -18, -12, -6, 6, 12, 18, 24, 30, 36];
                    const vzPoles = [-28.5, -23.5, -13.3, -3.3, 3.3, 13.3, 23.5, 28.5];
                    wireX(-12.85, -17.5, 17.5);                          // top 边
                    hxPoles.forEach(function (x) { poleAt(true, x, -15.35, -12.85); });
                    wireX(12.85, -17.5, 17.5);                           // bottom 边
                    hxPoles.forEach(function (x) { poleAt(true, x, 15.35, 12.85); });
                    wireZ(16.95, -13.4, 13.4);                           // right 边
                    vzPoles.forEach(function (z) { poleAt(false, z, 19.45, 16.95); });
                    wireZ(-16.95, -13.4, 13.4);                          // left 边
                    vzPoles.forEach(function (z) { poleAt(false, z, -19.45, -16.95); });
                })();

                /* —— 路边垃圾桶 + 路标（独立于公交站，散落在人行道上） —— */
                [[-8, -11.4], [-3, -11.4], [4, -11.4], [9, -11.4],
                 [-5, 11.4], [3, 11.4], [8, 11.4],
                 [-15.5, -5], [-15.5, 2], [15.5, -3], [15.5, 4]].forEach(function (p) {
                    const t = trashCan();
                    t.position.set(p[0], SURF, p[1]);
                    world.add(t);
                });
                [[-11, -11.4, 0], [7, -11.4, Math.PI], [-2, 11.4, 0], [11, 11.4, Math.PI],
                 [-15.5, -8, Math.PI / 2], [-15.5, 8, -Math.PI / 2],
                 [15.5, -9, Math.PI / 2], [15.5, 9, -Math.PI / 2]].forEach(function (p) {
                    const s = roadSign();
                    s.position.set(p[0], SURF, p[1]);
                    s.rotation.y = p[2];
                    world.add(s);
                });

                /* —— 上下车逻辑 —— */
                function startBoarding(stop, busObj) {
                    stop.boarding = true;
                    stop.boardT = 0;
                    stop.doorVec.set(busObj.g.position.x, SWY, busObj.g.position.z);
                    if (stop.queue.length >= 1) {
                        stop.boarder = stop.queue.shift();
                    }
                    const alighter = makeWaiter();
                    alighter.g.position.copy(stop.doorVec);
                    alighter.g.scale.setScalar(0.001);
                    stop.alighter = alighter;
                }
                function finishBoarding(stop) {
                    if (stop.boarder) {
                        world.remove(stop.boarder.g);
                        stop.boarder = null;
                    }
                    if (stop.alighter) {
                        stop.alighter.g.scale.setScalar(1);
                        stop.alighter.g.position.copy(spotVec(stop, 0));
                        stop.queue.unshift(stop.alighter);
                        stop.alighter = null;
                    }
                    stop.boarding = false;
                }

                function update(dt, t) {
                    const EDGES = traffic.EDGES, NODES = traffic.NODES, sigState = traffic.sigState;
                    function rf(edge, dir, t) {
                        const e = EDGES[edge];
                        const horiz = Math.abs(e.dx) > Math.abs(e.dz);
                        const a = NODES[e.a];
                        const tt = (dir === 1) ? t : (1 - t);
                        return { horiz: horiz, road: horiz ? a.z : a.x, sign: (dir === 1) ? 1 : -1,
                            fwd: horiz ? (a.x + e.dx * tt) : (a.z + e.dz * tt) };
                    }

                    buses.forEach(function (b) {
                        const seg = route[b.seg];
                        const e = EDGES[seg.edge];

                        if (b.state === 'dwell') {
                            b.dwellT -= dt;
                            const stop = stops[b.seg];
                            if (stop.boarding) {
                                stop.boardT += dt;
                                const f = Math.min(1, stop.boardT / DWELL);
                                if (stop.boarder) {
                                    stop.boarder.g.position.lerpVectors(spotVec(stop, 0), stop.doorVec, f);
                                    stop.boarder.g.scale.setScalar(Math.max(0.001, 1 - f));
                                }
                                if (stop.alighter && f > 0.45) {
                                    const g2 = Math.min(1, (f - 0.45) / 0.55);
                                    stop.alighter.g.position.lerpVectors(stop.doorVec, spotVec(stop, 0), g2);
                                    stop.alighter.g.scale.setScalar(Math.min(1, g2 * 2));
                                }
                            }
                            if (b.dwellT <= 0) {
                                b.state = 'drive';
                                b.dwelled = true;
                                finishBoarding(stop);
                            }
                        } else {
                            const arrivedKey = (seg.dir === 1) ? e.b : e.a;
                            const axis = Math.abs(e.dx) > Math.abs(e.dz) ? 'ew' : 'ns';
                            let stopLine = 1;
                            if (sigState(arrivedKey, axis, t) === 'red') stopLine = 1 - 5.0 / e.len;

                            // 前方同车道有小车太近：公交跟着减速，不再从车身里碾过去（跨共线边也生效）
                            let bf = 1;
                            const ags = world.userData.agents;
                            const bk = rf(seg.edge, seg.dir, b.t);
                            for (let k = 0; k < ags.length; k++) {
                                const o = ags[k];
                                if (o.type !== 'car' || o.state === 'shrink') continue;
                                const ok = rf(o.edge, o.dir, o.t);
                                if (ok.horiz !== bk.horiz || ok.road !== bk.road || ok.sign !== bk.sign) continue;
                                const gap = (ok.fwd - bk.fwd) * bk.sign;
                                if (gap > 0 && gap < 3.2) bf = Math.min(bf, Math.max(0, (gap - 1.7) / 1.5));
                            }
                            let targetT = b.t + (dt * b.speed * bf) / e.len;
                            if (!b.express && !b.dwelled && b.t < STOP_T && targetT >= STOP_T) {
                                targetT = STOP_T;
                                b.state = 'dwell';
                                b.dwellT = DWELL;
                                b.t = STOP_T;
                                startBoarding(stops[b.seg], b);
                            }
                            if (targetT > stopLine && b.t <= stopLine) targetT = stopLine;
                            b.t = targetT;

                            if (b.t >= 1) {
                                b.seg = (b.seg + 1) % route.length;
                                b.t = 0;
                                b.dwelled = false;
                            }
                        }

                        const ee = EDGES[route[b.seg].edge];
                        const A = NODES[ee.a];
                        const dd = route[b.seg].dir;
                        const tt = dd === 1 ? b.t : 1 - b.t;
                        const sx = dd === 1 ? ee.dx : -ee.dx;
                        const sz = dd === 1 ? ee.dz : -ee.dz;
                        const il = 1 / ee.len;
                        b.g.position.set(
                            A.x + ee.dx * tt - sz * il * BUS_LANE,
                            0.05,
                            A.z + ee.dz * tt + sx * il * BUS_LANE
                        );
                        let th = ee.heading + (dd === -1 ? Math.PI : 0);
                        if (th > Math.PI) th -= Math.PI * 2;
                        if (th < -Math.PI) th += Math.PI * 2;
                        let dh = th - b.heading;
                        while (dh > Math.PI) dh -= Math.PI * 2;
                        while (dh < -Math.PI) dh += Math.PI * 2;
                        b.heading += dh * Math.min(1, dt * 9);
                        b.g.rotation.y = b.heading;
                    });

                    // 候车人轻微起伏（正在上车的人由 boarding 动画控制）
                    stops.forEach(function (s) {
                        s.queue.forEach(function (q, i) {
                            q.g.position.y = SWY + Math.sin(t * 1.6 + i) * 0.012;
                        });
                    });
                }

                return { update: update };
            })();

            // 云朵：围在外圈上空缓慢绕行，白天纯白、夜里偏灰蓝
            const cloudMat = new THREE.MeshStandardMaterial({
                color: 0xFFFFFF, roughness: 1, metalness: 0,
                transparent: true, opacity: 0.9, flatShading: true
            });
            const cloudNight = new THREE.Color(0x7C8AA5);
            const cloudDay = new THREE.Color(0xFFFFFF);
            const cloudRing = new THREE.Group();
            world.add(cloudRing);
            (function buildClouds() {
                function puff(g, x, y, z, s) {
                    const p = sph(1, cloudMat);
                    const r = (0.9 + rand() * 0.7) * s;
                    p.scale.set(r, r * 0.7, r * 0.92);
                    p.position.set(x, y, z);
                    p.castShadow = false; p.receiveShadow = false;
                    g.add(p);
                }
                for (let i = 0; i < 16; i++) {
                    const a = (i / 16) * Math.PI * 2 + rand() * 0.45;
                    const rad = 38 + rand() * 36;
                    const s = 2.0 + rand() * 1.6;
                    const g = new THREE.Group();
                    const n = 5 + Math.floor(rand() * 3);
                    for (let k = 0; k < n; k++) {
                        puff(g, (k - n / 2) * 0.8 * s + rand() * 0.3 * s,
                            (rand() - 0.5) * 0.3 * s,
                            (rand() - 0.5) * 0.45 * s, s * (0.85 + rand() * 0.35));
                    }
                    g.position.set(Math.cos(a) * rad, 8 + rand() * 11, Math.sin(a) * rad);
                    g.userData.cloudPhase = rand() * Math.PI * 2;
                    g.userData.cloudFloat = 0.3 + rand() * 0.6;
                    g.userData.cloudBaseY = g.position.y;
                    cloudRing.add(g);
                }
            })();

            // 飞鸟：偶尔一只低多边形海鸥从场地一侧掠过
            const birds = [];
            let birdTimer = 5;
            const birdMat = new THREE.MeshStandardMaterial({ color: 0xFCFCF6, roughness: 0.95, metalness: 0, flatShading: true });
            const birdTipMat = new THREE.MeshStandardMaterial({ color: 0xB9C2CC, roughness: 0.95, metalness: 0, flatShading: true });
            function spawnBird() {
                const g = new THREE.Group();
                const body = sph(0.4, birdMat);
                body.scale.set(1, 0.72, 2.0);
                body.castShadow = false; body.receiveShadow = false;
                g.add(body);
                const head = sph(0.24, birdMat);
                head.position.set(0, 0.12, 0.72);
                head.castShadow = false; head.receiveShadow = false;
                g.add(head);
                const wings = [];
                for (let s = -1; s <= 1; s += 2) {
                    const pivot = new THREE.Group();
                    const seg = box(1.45, 0.06, 0.5, birdMat);
                    seg.position.x = s * 0.72;
                    seg.castShadow = false; seg.receiveShadow = false;
                    pivot.add(seg);
                    const tip = box(0.62, 0.055, 0.34, birdTipMat);
                    tip.position.set(s * 1.62, 0, 0.02);
                    tip.castShadow = false; tip.receiveShadow = false;
                    pivot.add(tip);
                    pivot.position.set(s * 0.12, 0.08, 0.05);
                    g.add(pivot);
                    wings.push(pivot);
                }
                // 从外圈一侧随机起飞，斜穿场地飞向对面
                const a = rand() * Math.PI * 2;
                const d = 78;
                g.position.set(Math.cos(a) * d, 10 + rand() * 7, Math.sin(a) * d);
                const target = new THREE.Vector3(
                    Math.cos(a + Math.PI + (rand() - 0.5) * 0.8) * d,
                    g.position.y + (rand() - 0.5) * 2,
                    Math.sin(a + Math.PI + (rand() - 0.5) * 0.8) * d
                );
                const dir = target.clone().sub(g.position).normalize();
                g.rotation.y = Math.atan2(dir.x, dir.z);
                g.userData = { dir: dir, speed: 7 + rand() * 5, phase: rand() * 6.28, wings: wings, age: 0 };
                world.add(g);
                birds.push(g);
            }

            /* ══════════ 城市扩建：小吃街 / 咖啡厅 / 奶茶店 / 地铁站 / 天桥 ══════════ */
            const crowd = [];
            (function cityExtras() {
                const GY = -0.15;
                const red = mat(0xC0463A);
                const glass = mat(0xA9CFE0, { transparent: true, opacity: 0.62, roughness: 0.2 });
                const lanternGeo = new THREE.SphereGeometry(0.09, 8, 6);
                const put = function (o, x, y, z) { o.position.set(x, y, z); o.castShadow = false; o.receiveShadow = false; return o; };
                const grp = function (x, z, ry) { const g = new THREE.Group(); g.position.set(x, GY, z); g.rotation.y = ry || 0; world.add(g); return g; };
                function sign(text, w, h, bg, fg) {
                    const cv = document.createElement('canvas');
                    cv.width = 256; cv.height = Math.max(32, Math.round(256 * h / w));
                    const c = cv.getContext('2d');
                    c.fillStyle = bg; c.fillRect(0, 0, cv.width, cv.height);
                    c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle';
                    c.font = 'bold ' + Math.round(cv.height * 0.56) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
                    c.fillText(text, cv.width / 2, cv.height / 2 + 2);
                    const tex = new THREE.CanvasTexture(cv);
                    if ('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
                    return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
                }
                const shirts = [M.pink, M.purple, M.yellow, M.roof, M.leafB, M.screen];
                function figure(parent, x, y, z, col) {
                    const f = new THREE.Group();
                    f.add(put(cap(0.09, 0.22, col), 0, 0.3, 0));
                    f.add(put(sph(0.075, M.cream, 8), 0, 0.66, 0));
                    f.position.set(x, y, z);
                    (parent || world).add(f);
                    return f;
                }

                // 通用小店：墙体 + 暖光橱窗 + 雨棚 + 发光招牌
                function shop(x, z, ry, w, d, h, wall, awn, text, bg, fg) {
                    const g = grp(x, z, ry);
                    g.add(put(box(w, h, d, wall), 0, h / 2, 0));
                    g.add(put(box(w + 0.2, 0.12, d + 0.2, M.wallDark), 0, h + 0.06, 0));
                    g.add(put(box(w * 0.78, h * 0.4, 0.05, M.windowLight), 0, h * 0.36, d / 2 + 0.02));
                    const aw = put(box(w + 0.3, 0.07, 0.85, awn), 0, h * 0.7, d / 2 + 0.38);
                    aw.rotation.x = 0.22; g.add(aw);
                    const sg = sign(text, w * 0.92, 0.5, bg, fg);
                    sg.position.set(0, h - 0.4, d / 2 + 0.03); g.add(sg);
                    return g;
