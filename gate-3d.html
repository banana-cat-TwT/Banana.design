            addFloat(new THREE.OctahedronGeometry(0.3), M.leafB, -6.6, 2.8, -1.6, 0.32, 1.1, 2.2);
            addFloat(new THREE.IcosahedronGeometry(0.26), M.water, 2.0, 3.2, -6.0, 0.28, 1.35, 0.7);

            // 河里的小船
            (function boats() {
                [[-8.4, -4.4], [2.4, 1.7], [11.0, 5.3]].forEach(function (b, i) {
                    const g = new THREE.Group();
                    const hull = box(0.72, 0.16, 0.34, M.roofB); hull.position.y = 0.06; g.add(hull);
                    const mast = cyl(0.022, 0.022, 0.6, M.woodD, 5); mast.position.y = 0.4; g.add(mast);
                    const sail = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.46, 3), i % 2 ? M.cream : M.pink);
                    sail.position.set(0.02, 0.44, 0); sail.rotation.y = Math.PI / 2; sail.castShadow = true; g.add(sail);
                    g.position.set(b[0], 0.24, b[1]);
                    g.rotation.y = -0.5 + i * 0.4;
                    world.add(g);
                    floats.push({ o: g, base: 0.24, amp: 0.03, speed: 1.1 + i * 0.2, phase: i * 1.7 });
                });
            })();

            // 河上小桥
            (function bridge() {
                const p = riverCurve.getPointAt(0.42);
                const g = new THREE.Group();
                const deck = box(1.0, 0.12, 3.0, M.wood); deck.position.y = 0.72; g.add(deck);
                for (let i = 0; i < 5; i++) {
                    const plank = box(1.06, 0.05, 0.42, M.woodD);
                    plank.position.set(0, 0.8, -1.2 + i * 0.6);
                    g.add(plank);
                }
                [-0.56, 0.56].forEach(function (x) {
                    const rail = box(0.07, 0.07, 3.0, M.woodD); rail.position.set(x, 1.12, 0); g.add(rail);
                    [-1.3, 0, 1.3].forEach(function (z) {
                        const post = cyl(0.045, 0.045, 0.5, M.woodD, 5);
                        post.position.set(x, 0.95, z);
                        g.add(post);
                    });
                });
                [-1.35, 1.35].forEach(function (z) {
                    const pier = box(0.9, 0.7, 0.18, M.woodD); pier.position.set(0, 0.38, z); g.add(pier);
                });
                const ang = Math.atan2(1, 1);
                g.position.set(p.x - 0.4, 0, p.z - 0.4);
                g.rotation.y = ang + 1.35;
                world.add(g);
            })();

            /* ══════════ 相机状态与取景 ══════════ */
            const HOME = { yaw: 0.62, pitch: 0.88 };
            const view = {
                yaw: HOME.yaw, pitch: HOME.pitch, dist: 52,
                tYaw: HOME.yaw, tPitch: HOME.pitch, tDist: 52,
                cx: 0, cz: 0, tcx: 0, tcz: 0
            };
            const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

            function fitDistance() {
                const tan = Math.tan(camera.fov * Math.PI / 360);
                const dH = 13.6 / tan;
                const dW = 17.8 / (tan * camera.aspect);
                let d = Math.max(dH, dW) * 1.04;
                // 竖屏时允许左右少量裁切，让沙盘撑满，别缩成一小块
                if (camera.aspect < 0.95) d *= 0.88;
                return d;
            }
            const minDist = () => fitDistance() * 0.56;
            const maxDist = () => fitDistance() * 1.5;

            view.dist = view.tDist = fitDistance();

            let auto = true;
            let dragging = false;
            let idle = 0;
            let active = 0;
            let celebrated = false;

            function resetView() {
                view.tYaw = HOME.yaw;
                view.tPitch = HOME.pitch;
                view.tDist = fitDistance();
                view.tcx = 0;
                view.tcz = 0;
            }

            /* ══════════ 指针交互（拖拽旋转 / 平移 / 双指缩放 / 滚轮） ══════════ */
            const pointers = new Map();
            let velYaw = 0, panning = false, lastMoveT = 0;
            let lastPinch = 0;

            canvas.addEventListener('pointerdown', function (e) {
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
                dragging = true;
                idle = 0;
                velYaw = 0;
                panning = e.button === 2 || e.shiftKey;   // 右键 / Shift 拖动 = 平移
                canvas.classList.add('grabbing');
            });

            canvas.addEventListener('pointermove', function (e) {
                const p = pointers.get(e.pointerId);
                if (!p) return;
                const dx = e.clientX - p.x;
                const dy = e.clientY - p.y;
                p.x = e.clientX;
                p.y = e.clientY;
                idle = 0;

                if (pointers.size >= 2) {
                    const pts = Array.from(pointers.values());
                    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    if (lastPinch) {
                        const ratio = lastPinch / Math.max(d, 1);
                        view.tDist = clamp(view.tDist * ratio, minDist(), maxDist());
                    }
                    lastPinch = d;
                    return;
                }
                if (!dragging) return;

                lastMoveT = performance.now();
                if (panning) {
                    const k = view.dist * 0.0016, c = Math.cos(view.yaw), s = Math.sin(view.yaw);
                    view.tcx = clamp(view.tcx - dx * c * k - dy * s * k, -9, 9);
                    view.tcz = clamp(view.tcz + dx * s * k - dy * c * k, -9, 9);
                    return;
                }
                view.tYaw -= dx * 0.006;
                view.tPitch = clamp(view.tPitch + dy * 0.004, 0.52, 1.3);
                velYaw += (-dx * 0.006 - velYaw) * 0.5;
            });

            function endPointer(e) {
                pointers.delete(e.pointerId);
                if (performance.now() - lastMoveT > 90) velYaw = 0;   // 停住再松手就不甩出去
                if (pointers.size === 0) {
                    dragging = false;
                    canvas.classList.remove('grabbing');
                }
                lastPinch = 0;
            }
            canvas.addEventListener('pointerup', endPointer);
            canvas.addEventListener('pointercancel', endPointer);
            canvas.addEventListener('pointerleave', function (e) {
                if (pointers.size === 1) endPointer(e);
            });

            canvas.addEventListener('wheel', function (e) {
                e.preventDefault();
                const wy = clamp(e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY, -140, 140);
                view.tDist = clamp(view.tDist * Math.exp(wy * (e.ctrlKey ? 0.01 : 0.0011)), minDist(), maxDist());
                idle = 0;
            }, { passive: false });

            canvas.addEventListener('dblclick', resetView);
            canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

            /* —— 点击物体：位移 < 6px 且时长 < 350ms 才算点击，否则视为拖拽相机 —— */
            let _dnX = 0, _dnY = 0, _dnT = 0;
            canvas.addEventListener('pointerdown', function (e) {
                _dnX = e.clientX; _dnY = e.clientY; _dnT = performance.now();
            });
            canvas.addEventListener('pointerup', function (e) {
                if (performance.now() - _dnT > 350) return;
                if (Math.hypot(e.clientX - _dnX, e.clientY - _dnY) > 6) return;
                handleClick(e);
            });
            function handleClick(e) {
                const rect = canvas.getBoundingClientRect();
                _ptr.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                _ptr.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                _ray.setFromCamera(_ptr, camera);
                const hits = _ray.intersectObjects(scene.children, true);
                for (let i = 0; i < hits.length; i++) {
                    let o = hits[i].object;
                    while (o && !o.userData.clickable) o = o.parent;
                    if (o && o.userData.clickable) { triggerInteract(o.userData.clickable, hits[i].point); break; }
                }
            }

            /* ══════════ 标签投影 ══════════ */
            const pillEls = Array.from(document.querySelectorAll('.pill'));
            const stepEls = Array.from(document.querySelectorAll('.step'));
            const stepperEl = document.getElementById('stepper');
            const pencilEl = document.getElementById('pencil');
            const projV = new THREE.Vector3();
            let cardRect = null;
            let pillSizes = null;

            function measureCard() {
                const c = document.getElementById('gate-card');
                if (c) cardRect = c.getBoundingClientRect();
                pillSizes = pillEls.map(function (el) {
                    return { hw: el.offsetWidth / 2 || 64, hh: el.offsetHeight / 2 || 23 };
                });
            }
            pillEls.forEach(function (p) { p.style.opacity = '0'; });
            const smooth = pillEls.map(function () { return { x: 0, y: 0, ok: false }; });

            function updatePills() {
                const W = innerWidth, H = innerHeight;
                const list = [];
                for (let i = 0; i < pillEls.length; i++) {
                    const el = pillEls[i];
                    const v = projV.copy(anchors[i]).project(camera);
                    if (v.z > 1) { el.style.opacity = '0'; list.push(null); continue; }
                    const sz = (pillSizes && pillSizes[i]) || { hw: 64, hh: 23 };
                    const hw = sz.hw, hh = sz.hh;
                    const ax = (v.x * 0.5 + 0.5) * W;
                    const ay = (-v.y * 0.5 + 0.5) * H;
                    list.push({ el: el, x: ax, cy: ay - 14 - hh, hw: hw, hh: hh });
                }

                const live = list.filter(Boolean);

                // 可用范围：左边避开工具栏，下边避开时间轴
                const padL = W < 860 ? 70 : 76;
                const minX = padL, maxX = W - 14;
                const minC = 14, maxC = H - 74;
                const clampX = p => { p.x = Math.min(Math.max(p.x, minX + p.hw), maxX - p.hw); };
                const clampY = p => { p.cy = Math.min(Math.max(p.cy, minC + p.hh), maxC - p.hh); };

                live.forEach(clampX);
                live.forEach(clampY);

                function hitsCard(p) {
                    if (!cardRect) return false;
                    const L = cardRect.left - 10, R = cardRect.right + 10;
                    const T = cardRect.top - 10, B = cardRect.bottom + 10;
                    return p.x + p.hw > L && p.x - p.hw < R && p.cy + p.hh > T && p.cy - p.hh < B;
                }

                // 向上让位时，把上方会撞上的标签一起顶上去，免得被互斥逻辑又推回卡片
                function liftTogether(p, need) {
                    const cluster = [p];
                    for (let i = 0; i < cluster.length; i++) {
                        const A = cluster[i];
                        for (let j = 0; j < live.length; j++) {
                            const B = live[j];
                            if (B === A || cluster.indexOf(B) !== -1) continue;
                            const ox = Math.min(A.x + A.hw, B.x + B.hw) - Math.max(A.x - A.hw, B.x - B.hw);
                            if (ox <= 2) continue;
                            if (B.cy <= A.cy && A.cy - A.hh + 2 - need < B.cy + B.hh) cluster.push(B);
                        }
                    }
                    let top = Infinity;
                    for (let i = 0; i < cluster.length; i++) top = Math.min(top, cluster[i].cy - cluster[i].hh);
                    const d = Math.min(need, Math.max(0, top - minC - 2));
                    for (let i = 0; i < cluster.length; i++) cluster[i].cy -= d;
                }

                // 躲卡：优先整体上下平移（离哪边近走哪边），实在放不下才左右推
                function pushOffCard(p) {
                    if (!hitsCard(p)) return;
                    const L = cardRect.left - 10, R = cardRect.right + 10;
                    const T = cardRect.top - 10, B = cardRect.bottom + 10;
                    const dUp = (p.cy + p.hh) - T;
                    const dDown = B - (p.cy - p.hh);
                    const upOK = p.cy - dUp - p.hh >= minC;
                    const downOK = p.cy + dDown + p.hh <= maxC;
                    if (upOK && (!downOK || dUp <= dDown)) liftTogether(p, dUp + 4);
                    else if (downOK) p.cy += dDown + 4;
                    else {
                        if ((p.x + p.hw) - L <= R - (p.x - p.hw)) p.x -= (p.x + p.hw) - L + 4;
                        else p.x += R - (p.x - p.hw) + 4;
                        clampX(p);
                    }
                }

                // 标签互压：只做单向下移，避免左右来回打架
                function separateDown() {
                    const order = live.slice().sort(function (a, b) { return a.cy - b.cy; });
                    for (let i = 0; i < order.length; i++) {
                        const A = order[i];
                        let moved = false;
                        for (let j = 0; j < i; j++) {
                            const B = order[j];
                            const ox = Math.min(A.x + A.hw, B.x + B.hw) - Math.max(A.x - A.hw, B.x - B.hw);
                            if (ox <= 2) continue;
                            const oy = Math.min(A.cy + A.hh, B.cy + B.hh) - Math.max(A.cy - A.hh, B.cy - B.hh);
                            if (oy > 0) {
                                A.cy = B.cy + B.hh + A.hh + 4;
                                moved = true;
                            }
                        }
                        if (moved) clampY(A);
                    }
                }

                for (let pass = 0; pass < 3; pass++) {
                    live.forEach(pushOffCard);
                    separateDown();
                    live.forEach(clampX);
                }
                // 收尾：互斥可能把标签又推回卡片上方，最后再避一次
                live.forEach(pushOffCard);
                live.forEach(clampX);

                for (let i = 0; i < pillEls.length; i++) {
                    const p = list[i];
                    const s = smooth[i];
                    if (!p) { s.ok = false; pillEls[i].style.opacity = '0'; continue; }
                    const tx = p.x, ty = p.cy + p.hh;
                    if (!s.ok) { s.x = tx; s.y = ty; s.ok = true; }
                    else {
                        let dx = tx - s.x, dy = ty - s.y;
                        const d = Math.sqrt(dx * dx + dy * dy);
                        if (d < 1.5) {
                            // 死区：1.5px 内视为已到位，忽略避让算法在边界处的高频抖动
                        } else {
                            // 混合平滑：近距离指数衰减，远距离限速滑行，杜绝跳变
                            const step = Math.min(2.2, d * 0.22);
                            s.x += dx / d * step;
                            s.y += dy / d * step;
                        }
                    }
                    pillEls[i].style.transform = 'translate3d(' + s.x.toFixed(2) + 'px,' + s.y.toFixed(2) + 'px,0) translate(-50%,-100%)';
                    pillEls[i].style.opacity = '';
                }
            }

            /* ══════════ UI 联动 ══════════ */
            function syncUI(i) {
                stepEls.forEach(function (s, k) { s.classList.toggle('on', k === i); });
                pillEls.forEach(function (p, k) { p.classList.toggle('on', k === i); });
                const st = stepEls[i];
                if (st && pencilEl) {
                    pencilEl.style.left = (st.offsetLeft + st.offsetWidth / 2) + 'px';
                    pencilEl.classList.add('show');
                }
            }

            function focusZone(i) {
                const z = ZONES[i];
                active = i;
                idle = 0;
                // 相机位于 (sin yaw, cos yaw) 方向，屏幕右向为 (cos yaw, -sin yaw)
                // 令 yaw = -atan2(z.x, z.z)，被聚焦分区即落在屏幕右侧、垂直居中
                view.tYaw = -Math.atan2(z.z, z.x);
                view.tYaw += Math.round((view.yaw - view.tYaw) / (Math.PI * 2)) * Math.PI * 2;
                view.tPitch = 0.88;
                // 横屏时给一点拉远：分区转到对角位置后沙盘横向占宽变大，太近会把其余标签挤出屏幕
                // 竖屏反过来要推近，否则沙盘缩成卡片上方的一小块
                view.tDist = fitDistance() * (camera.aspect < 0.95 ? 0.82 : 1.14);
                view.tcx = 0;
                view.tcz = 0;
                syncUI(i);
            }

            pillEls.forEach(function (p) {
                p.addEventListener('click', function () { focusZone(parseInt(p.dataset.i, 10)); });
                p.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        focusZone(parseInt(p.dataset.i, 10));
                    }
                });
            });
            stepEls.forEach(function (s) {
                s.addEventListener('click', function () { focusZone(parseInt(s.dataset.i, 10)); });
            });

            /* ══════════ 环境面板 / 键盘 / 动态分辨率 ══════════ */
            let timeLock = null, timeShift = 0, timeDrag = false, lastTimeUI = 0;
            const envEl = document.getElementById('env');
            const wxBtns = Array.from(envEl.querySelectorAll('[data-w]'));
            const timeEl = document.getElementById('env-time');
            const clockEl = document.getElementById('env-clock');
            const phaseName = function (p) { return p < 0.06 || p > 0.94 ? '日出' : p < 0.44 ? '白天' : p < 0.56 ? '日落' : '夜晚'; };
            function setWeather(k) {
                weatherLock = k !== 'auto';
                if (weatherLock) wCur = WEATHER[k]; else wTimer = 4;
                wxBtns.forEach(function (b) { b.classList.toggle('on', b.dataset.w === k); });
            }
            wxBtns.forEach(function (b) { b.addEventListener('click', function () { setWeather(b.dataset.w); }); });
            timeEl.addEventListener('input', function () {
                timeDrag = true;
                timeLock = timeEl.value / 1000;
                clockEl.textContent = phaseName(timeLock);
            });
            timeEl.addEventListener('change', function () {   // 松手后从这一刻继续走
                timeDrag = false;
                timeShift = timeLock * 90 - clock.elapsedTime;
                timeLock = null;
            });

            // 键盘：方向键转视角 / + - 缩放 / R 复位 / 1-5 聚焦分区
            addEventListener('keydown', function (e) {
                if ((e.target && e.target.tagName === 'INPUT') || e.metaKey || e.ctrlKey || e.altKey) return;
                const k = e.key;
                let used = true;
                if (k === 'ArrowLeft') view.tYaw -= 0.16;
                else if (k === 'ArrowRight') view.tYaw += 0.16;
                else if (k === 'ArrowUp') view.tPitch = clamp(view.tPitch - 0.07, 0.52, 1.3);
                else if (k === 'ArrowDown') view.tPitch = clamp(view.tPitch + 0.07, 0.52, 1.3);
                else if (k === '+' || k === '=') view.tDist = clamp(view.tDist * 0.88, minDist(), maxDist());
                else if (k === '-' || k === '_') view.tDist = clamp(view.tDist / 0.88, minDist(), maxDist());
                else if (k === 'r' || k === 'R' || k === '0') resetView();
                else if (k >= '1' && k <= '5') focusZone(+k - 1);
                else used = false;
                if (used) { e.preventDefault(); idle = 0; }
            });

            // 动态分辨率：持续掉帧就降一档像素比，稳定后再慢慢升回去
            let pr = renderer.getPixelRatio();
            const prMax = pr;
            let perfAcc = 0, perfN = 0, perfHold = 0, perfWarm = 0;
            function setPR(v) {
                pr = v;
                renderer.setPixelRatio(v);
                renderer.setSize(innerWidth, innerHeight);
                if (composer) composer.setPixelRatio(v);
            }
            function tuneResolution(dt) {
                if (++perfWarm < 90 || dt > 0.2) return;   // 跳过 shader 编译的头几帧与切标签后的长帧
                perfAcc += dt; perfN++; perfHold -= dt;
                if (perfAcc < 1.6) return;
                const avg = perfAcc / perfN;
                perfAcc = 0; perfN = 0;
                if (avg > 0.026 && pr > 1) { setPR(Math.max(1, pr - 0.25)); perfHold = 10; }
                else if (avg < 0.0185 && pr < prMax && perfHold <= 0) setPR(Math.min(prMax, pr + 0.25));
            }

            /* ══════════ 主循环 ══════════ */
            const clock = new THREE.Clock();
            let firstFrame = true;

            // 四季叶色：春（黄绿）→ 夏（深绿）→ 秋（橙红）→ 冬（覆雪白）
            const leafSeasons = [
                [0xB6DC66, 0x9FCE4E, 0xD2E88A],
                [0x3F8F4A, 0x2F7F3E, 0x58A85C],
                [0xD2662A, 0xE08A2E, 0xB34A22],
                [0xEDF3F5, 0xE2EAEE, 0xF6FAFB]
            ].map(function (row) {
                return row.map(function (c) { return new THREE.Color(c); });
            });
            const leafMats = [M.leaf, M.leafB, M.leafC];
            function applySeason(phase) {
                const i = Math.floor(phase) % 4;
                const j = (i + 1) % 4;
                const f = phase - Math.floor(phase);
                for (let k = 0; k < 3; k++) {
                    leafMats[k].color.copy(leafSeasons[i][k]).lerp(leafSeasons[j][k], f);
                }
            }

            /* ══════════ 交通设施：机场 / 火车站 / 高铁 / 巡航飞机 ══════════ */
            const transportFacilities = (function () {
                const GY = -0.15;
                const put = function (o, x, y, z) {
                    o.position.set(x, y, z);
                    o.castShadow = false;
                    o.receiveShadow = false;
                    return o;
                };
                function signText(text, w, h, bg, fg) {
                    const cv = document.createElement('canvas');
                    cv.width = 256;
                    cv.height = Math.max(32, Math.round(256 * h / w));
                    const c = cv.getContext('2d');
                    c.fillStyle = bg; c.fillRect(0, 0, cv.width, cv.height);
                    c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle';
                    c.font = 'bold ' + Math.round(cv.height * 0.56) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
                    c.fillText(text, cv.width / 2, cv.height / 2 + 2);
                    const tex = new THREE.CanvasTexture(cv);
                    if ('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
                    const m = new THREE.Mesh(
                        new THREE.PlaneGeometry(w, h),
                        new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide })
                    );
                    m.castShadow = false; m.receiveShadow = false;
                    return m;
                }

                /* —— 飞机造型（机身朝 +z） —— */
                function airplane(color) {
                    const g = new THREE.Group();
                    const bmat = mat(color, { roughness: 0.45, metalness: 0.15 });
                    g.add(put(box(0.5, 0.5, 3.4, bmat), 0, 0.05, 0));
                    const nose = cone(0.25, 0.9, bmat, 12);
                    nose.rotation.x = -Math.PI / 2;

                const cups = new THREE.Group(); cups.position.y = 0.85; anemo.add(cups);
                for (let i = 0; i < 3; i++) {

                const wsign = label('气象台', 1.9, 0.46, '#3FA34D', '#FFFFFF');

                /* ── 邮轮：停泊湖面，轻微起伏与漂移 ── */
                const ship = new THREE.Group();
                ship.position.set(0, -0.106, 18.0);
                world.add(ship);
                ship.add(put(box(4.2, 0.8, 1.3, hullNavy), 0, 0.4, 0));
                const bow = cone(0.65, 1.5, hullNavy, 14);
                bow.rotation.x = -Math.PI / 2; bow.position.set(0, 0.4, 1.4); ship.add(bow);
                ship.add(put(box(3.6, 0.5, 1.15, hullWhite), 0, 1.05, -0.15));
                ship.add(put(box(2.6, 0.45, 1.0, hullWhite), 0, 1.55, -0.2));
                for (let i = 0; i < 6; i++) {
                    ship.add(put(cyl(0.05, 0.05, 0.05, M.windowLight, 8), -0.25 + i * 0.5, 0.48, 0.66));
                }
                const funnel = box(0.62, 0.9, 0.5, mat(0xE85A4A, { roughness: 0.6 }));
                funnel.position.set(0, 1.9, -0.55); funnel.rotation.x = -0.15; ship.add(funnel);
                ship.add(put(sph(0.15, M.ink, 8), 0, 2.45, -0.25));
                const shsign = label('邮轮', 1.7, 0.42, '#2C4A6E', '#FFFFFF');
                shsign.position.set(0, 1.75, 0.7); ship.add(shsign);

                function update(dt, t) {
                    wheel.rotation.z = t * 0.22;
                    for (let i = 0; i < cabins.length; i++) cabins[i].rotation.z = -wheel.rotation.z;

                    // 旋转木马：转台旋转，小马上下起伏
                    carouselSpin.rotation.y = t * 0.45;
                    for (let i = 0; i < carouselPonies.length; i++) {
                        carouselPonies[i].position.y = 0.5 + Math.sin(t * 2.1 + i * 1.6) * 0.08;
                    }

                    const cu = (t * 0.07) % 1;
                    const cp = coasterCurve.getPointAt(cu);
                    const ctg = coasterCurve.getTangentAt(cu).normalize();
                    coasterTrain.position.copy(cp);
                    coasterTrain.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), ctg);

                    ship.position.y = -0.106 + Math.sin(t * 0.7) * 0.03;
                    ship.rotation.z = Math.sin(t * 0.5) * 0.035;
                    ship.rotation.y = Math.sin(t * 0.12) * 0.35;
                    ship.position.x = Math.sin(t * 0.08) * 1.1;
                    ship.position.z = 18.0 + Math.cos(t * 0.09) * 0.5;

                    cups.rotation.y = t * 6;
                    radome.rotation.y = t * 0.6;

                    beacon.visible = Math.sin(t * 2.5) > -0.2;
                }

                return { update: update, wheel: wheel, cabins: cabins, ship: ship, coasterTrain: coasterTrain, cups: cups, beacon: beacon };
            })();

            /* ══════════ 点击物体交互：沙盘彩蛋 ══════════ */
            const _ray = new THREE.Raycaster();
            const _ptr = new THREE.Vector2();
            const clickState = {
                cars: new Map(),      // agent -> { t, blink, laneFrom, laneTo }
                people: new Map(),    // 人的 group -> { t, fx, fz }
                trees: new Map(),     // 树的 group -> { t }
                fountains: new Map(), // 喷泉 ref -> { t }
                cityGlow: null,       // { t } 全城窗户闪烁
                ripples: [],          // 湖面圆环 -> 扩散、淡出后销毁
                lamps: new Map()      // 路灯 rig -> { t, duration, mat }
            };

            // 收集所有可点击对象并打标签；给车克隆独立车灯材质，才能单独控制闪灯
            (function registerClickables() {
                const carMats = [M.carHead, M.carTail];
                function tagCar(a) {
                    a.g.userData.clickable = { type: 'car', ref: a };
                    const lights = [];
                    a.g.traverse(function (o) {
                        if (o.isMesh && carMats.indexOf(o.material) > -1) {
                            const isHead = o.material === M.carHead;   // 克隆前先记下是前灯还是尾灯
                            const m = o.material.clone();
                            o.material = m;
                            lights.push({ mat: m, kind: isHead ? 'head' : 'tail' });
                        }
                    });
                    a._lights = lights;
                }
                const agents = world.userData.agents || [];
                for (let i = 0; i < agents.length; i++) tagCar(agents[i]);
                // 注：公交车由独立的 busSystem 驱动，位置/停靠逻辑复杂，暂不纳入点击交互

                function tagPerson(g) { g.userData.clickable = { type: 'person', ref: g }; }
                for (let i = 0; i < people.length; i++) tagPerson(people[i].g);
                for (let i = 0; i < swWalkers.length; i++) tagPerson(swWalkers[i].g);
                for (let i = 0; i < swChatters.length; i++) tagPerson(swChatters[i].g);
                for (let i = 0; i < crowd.length; i++) tagPerson(crowd[i].g);
                const tr = world.userData.traffic;
                if (tr && tr.CROSSERS) for (let i = 0; i < tr.CROSSERS.length; i++) tagPerson(tr.CROSSERS[i].g);

                if (transportFacilities.flyPlane) {
                    transportFacilities.flyPlane.userData.clickable = { type: 'plane' };
                }
            })();

            // 有轨电车铃声：首次点击时懒创建 AudioContext，现场合成两声短促“叮叮”
            let tramAudioCtx = null;
            function ringTramBell() {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                if (!tramAudioCtx) tramAudioCtx = new AudioCtx();
                const ctx = tramAudioCtx;
                if (ctx.state === 'suspended') ctx.resume().catch(function () {});
                const start = ctx.currentTime + 0.02;
                [0, 0.23].forEach(function (offset) {
                    const at = start + offset;
                    const envelope = ctx.createGain();
                    envelope.gain.setValueAtTime(0.0001, at);
                    envelope.gain.exponentialRampToValueAtTime(0.14, at + 0.008);
                    envelope.gain.exponentialRampToValueAtTime(0.0001, at + 0.34);
                    envelope.connect(ctx.destination);
                    [1, 2.01].forEach(function (harmonic, index) {
                        const osc = ctx.createOscillator();
                        const level = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(1568 * harmonic, at);
                        level.gain.value = index === 0 ? 1 : 0.24;
                        osc.connect(level);
                        level.connect(envelope);
                        osc.start(at);
                        osc.stop(at + 0.36);
                        osc.onended = function () {
                            osc.disconnect();
                            level.disconnect();
                            if (index === 1) envelope.disconnect();
                        };
                    });
                });
            }

            function triggerInteract(c, point) {
                if (c.type === 'plane') {
                    transportFacilities.clickPlane();
                } else if (c.type === 'car') {
                    const a = c.ref;
                    if (!clickState.cars.has(a)) {
                        clickState.cars.set(a, { t: 2.4, blink: 0, laneFrom: a.lane, laneTo: -a.lane });
                    }
                } else if (c.type === 'person') {
                    // 点一个人 → 附近所有人受惊，朝远离点击点的方向四散逃跑
                    const groups = [people, swWalkers, swChatters, crowd];
                    const trf = world.userData.traffic;
                    if (trf && trf.CROSSERS) groups.push(trf.CROSSERS);   // 过街行人也一起受惊逃跑
                    const origin = c.ref.position;
                    for (let gi = 0; gi < groups.length; gi++) {
                        const arr = groups[gi];
                        for (let i = 0; i < arr.length; i++) {
                            const g = arr[i].g;
                            let dx = g.position.x - origin.x;
                            let dz = g.position.z - origin.z;
                            const d = Math.hypot(dx, dz) || 1;
                            const dist = 3 + Math.random() * 4;
                            // 远离点击点 + 随机扰动，形成四散效果
                            clickState.people.set(g, {
                                t: 1.8 + Math.random() * 1.2,
                                by: g.position.y,   // 记录基准高度，逃跑时保持
                                fx: g.position.x + (dx / d) * dist + (Math.random() - 0.5) * 2.5,
                                fz: g.position.z + (dz / d) * dist + (Math.random() - 0.5) * 2.5
                            });
                        }
                    }
                } else if (c.type === 'tree') {
                    if (!clickState.trees.has(c.ref)) clickState.trees.set(c.ref, { t: 1.6 });
                } else if (c.type === 'fountain') {
                    if (!clickState.fountains.has(c.ref)) clickState.fountains.set(c.ref, { t: 2.0 });
                } else if (c.type === 'city') {
                    clickState.cityGlow = { t: 2.8 };
                } else if (c.type === 'lake') {
                    // 三道错时扩散的水环，只出现在实际点击的湖面位置
                    for (let i = 0; i < 3; i++) {
                        const ringMat = new THREE.MeshBasicMaterial({
                            color: 0xE8FAFF, transparent: true, opacity: 0.68,
                            depthWrite: false, side: THREE.DoubleSide, toneMapped: false
                        });
                        const ring = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.49, 48), ringMat);
                        ring.rotation.x = -Math.PI / 2;
                        ring.position.copy(point);
                        ring.position.y += 0.025;
                        ring.scale.setScalar(0.35);
                        ring.visible = i === 0;
                        ring.castShadow = false;
                        ring.receiveShadow = false;
                        ring.renderOrder = 4;
                        world.add(ring);
                        clickState.ripples.push({ mesh: ring, t: -i * 0.18, duration: 1.25 });
                    }
                } else if (c.type === 'tram') {
                    ringTramBell();
                } else if (c.type === 'lamp') {
                    const rig = c.ref;
                    const active = clickState.lamps.get(rig);
                    if (active) {
                        active.t = active.duration;
                    } else {
                        // 共享材质先克隆，确保只点亮这一盏，不影响其他路灯
                        const lampMat = rig.head.material === M.streetLamp ? M.streetLamp.clone() : rig.head.material;
                        rig.head.material = lampMat;
                        clickState.lamps.set(rig, { t: 1.25, duration: 1.25, mat: lampMat });
                    }
                }
            }

            function interactUpdate(dt, t) {
                // 被点击的车：车灯快速双闪脉冲；其余车：车灯跟随昼夜亮度同步
                const ags = world.userData.agents || [];
                for (let i = 0; i < ags.length; i++) {
                    const a = ags[i];
                    if (!a._lights) continue;
                    const cs = clickState.cars.get(a);
                    if (cs) {
                        cs.blink += dt;
                        const pulse = 0.5 + 0.5 * Math.sin(cs.blink * 16);
                        const on = 2.8 * pulse;
                        for (let li = 0; li < a._lights.length; li++) a._lights[li].mat.emissiveIntensity = on;
                    } else {
                        for (let li = 0; li < a._lights.length; li++) {
                            const ref = a._lights[li].kind === 'head' ? M.carHead : M.carTail;
                            a._lights[li].mat.emissiveIntensity = ref.emissiveIntensity;
                        }
                    }
                }

                // 被点击的树：来回摇摆（像被逗乐了），结束后复位
                clickState.trees.forEach(function (cs, g) {
                    cs.t -= dt;
                    const env = Math.min(1, cs.t * 4);
                    g.rotation.z = Math.sin(cs.t * 15) * 0.22 * env;
                    g.rotation.x = Math.sin(cs.t * 11 + 1.3) * 0.12 * env;
                    if (cs.t <= 0) { g.rotation.z = 0; g.rotation.x = 0; clickState.trees.delete(g); }
                });

                // 被点击的喷泉：水柱/碗上下喷发脉冲，结束后复位
                clickState.fountains.forEach(function (cs, ref) {
                    cs.t -= dt;
                    const p = Math.max(0, Math.sin(cs.t * 6));
                    ref.pillar.scale.y = 1 + p * 0.9;
                    ref.bowl.scale.setScalar(1 + p * 0.45);
                    if (cs.t <= 0) { ref.pillar.scale.y = 1; ref.bowl.scale.setScalar(1); clickState.fountains.delete(ref); }
                });

                // 被点击的楼：全城窗户快速闪烁亮灯，结束后交还昼夜循环
                if (clickState.cityGlow) {
                    const cg = clickState.cityGlow;
                    cg.t -= dt;
                    const wave = Math.sin(t * 24) > 0 ? 2.7 : 0.12;
                    M.windowLight.emissiveIntensity = wave;
                    const cwm = world.userData.cityWindowMats;
                    if (cwm) for (let i = 0; i < cwm.length; i++) cwm[i].emissiveIntensity = wave * 0.9;
                    if (cg.t <= 0) clickState.cityGlow = null;
                }

                // 湖面涟漪：错时出现、扩散并淡出，结束后释放几何体和材质
                for (let i = clickState.ripples.length - 1; i >= 0; i--) {
                    const r = clickState.ripples[i];
                    r.t += dt;
                    if (r.t < 0) continue;
                    const p = r.t / r.duration;
                    if (p >= 1) {
                        world.remove(r.mesh);
                        r.mesh.geometry.dispose();
                        r.mesh.material.dispose();
                        clickState.ripples.splice(i, 1);
                        continue;
                    }
                    r.mesh.visible = true;
                    r.mesh.scale.setScalar(0.35 + p * 3.1);
                    r.mesh.material.opacity = (1 - p) * 0.68;
                }

                // 单盏路灯：柔和亮起再熄灭，结束后恢复共享材质与昼夜控制
                clickState.lamps.forEach(function (cs, rig) {
                    cs.t -= dt;
                    if (cs.t <= 0) {
                        rig.head.material = M.streetLamp;
                        cs.mat.dispose();
                        clickState.lamps.delete(rig);
                        return;
                    }
                    const p = 1 - cs.t / cs.duration;
                    const pulse = Math.sin(p * Math.PI);
                    cs.mat.emissiveIntensity = M.streetLamp.emissiveIntensity + pulse * 3.4;
                    if (rig.light) rig.light.intensity += pulse * 3.2;
                });
            }

            // 逃跑移动：朝目标点狂奔，到达或超时结束；返回 true 表示正在逃跑（调用方跳过原逻辑）
            function fleeStep(g, dt) {
                const cs = clickState.people.get(g);
                if (!cs) return false;
                cs.t -= dt;
                const dx = cs.fx - g.position.x;
                const dz = cs.fz - g.position.z;
                const d = Math.hypot(dx, dz);
                if (d > 0.05) {
                    const mv = Math.min(d, 4.2 * dt);
                    g.position.x += (dx / d) * mv;
                    g.position.z += (dz / d) * mv;
                    g.rotation.y = Math.atan2(dx, dz);   // 人物正面朝 +z，面朝跑动方向
                }
                g.position.y = cs.by + Math.abs(Math.sin(performance.now() * 0.018)) * 0.06;  // 跑动小颠
                if (cs.t <= 0 || d < 0.1) clickState.people.delete(g);
                return true;
            }

            function frame() {
                let dt = clock.getDelta();
                if (!(dt > 0)) dt = 1 / 60; // 少数环境会给出 0，兜底避免补间停住
                dt = Math.min(dt, 0.25);
                const t = clock.elapsedTime;
                tuneResolution(dt);

                // 四季：每季 20 秒，叶色平滑过渡（黄绿 → 深绿 → 橙红 → 雪白）
                applySeason((t / 20) % 4);

                // ═════ 昼夜循环（90 秒一个昼夜：光色/强度/天空色随时间平滑变化） ═════
                const dayPhase = timeLock !== null ? timeLock : ((t + timeShift) / 90) % 1;
                if (!timeDrag && t - lastTimeUI > 0.25) {
                    lastTimeUI = t;
                    timeEl.value = Math.round(dayPhase * 1000);
                    clockEl.textContent = phaseName(dayPhase);
                }
                const sunAng = dayPhase * Math.PI * 2;
                const sunH = Math.sin(sunAng);
                sun.position.set(Math.cos(sunAng) * 30, sunH * 30, 13);
                const daylight = sunH > 0 ? Math.pow(sunH, 0.55) : 0;
                const warm = Math.max(0, 1 - Math.abs(sunH) * 2.5);
                skyC.copy(nightSky).lerp(daySky, daylight).lerp(dawnSky, warm * 0.55);
                sun.color.copy(skyC);
                sun.intensity = 0.08 + daylight * 1.62;
                sun.castShadow = daylight > 0.06;
                hemi.color.copy(nightSky).lerp(daySky, daylight);
                hemi.groundColor.copy(nightGround).lerp(dayGround, daylight);
                hemi.intensity = 0.26 + daylight * 0.34;
                fill.intensity = 0.16 + daylight * 0.36;
                renderer.toneMappingExposure = 0.63 + daylight * 0.37;

                // ═════ 夜间亮灯：跟着天色走，天一暗就亮（不再等整点） ═════
                // nightK：0 = 白天，1 = 全黑。平滑过渡，避免开关灯突兀
                const nightK = 1 - THREE.MathUtils.smoothstep(daylight, 0.04, 0.34);
                M.windowLight.emissiveIntensity = 1.6 * nightK;
                // 外围城市楼窗户（独立材质数组，每个窗户材质相同但不是 M.windowLight 实例）
                const cityWinMats = world.userData.cityWindowMats;
                if (cityWinMats) {
                    const ei = 1.4 * nightK;
                    for (let i = 0; i < cityWinMats.length; i++) cityWinMats[i].emissiveIntensity = ei;
                }
                // 路灯：黄昏渐亮、清晨渐灭；灯球发光驱动 bloom，点光源照亮地面
                M.streetLamp.emissiveIntensity = 1.9 * nightK;
                for (let i = 0; i < streetlights.length; i++) {
                    if (streetlights[i].light) streetlights[i].light.intensity = 2.3 * nightK;
                }
                const roadLampRigs = world.userData.traffic ? world.userData.traffic.ROAD_LAMPS : null;
                if (roadLampRigs) {
                    for (let i = 0; i < roadLampRigs.length; i++) {
                        if (roadLampRigs[i].light) roadLampRigs[i].light.intensity = 1.9 * nightK;
                    }
                }
                M.carHead.emissiveIntensity = 2.2 * nightK;
                M.carTail.emissiveIntensity = 1.9 * nightK;

                // ═════ 红绿灯：东西 / 南北交替放行 ═════
                const sigs = world.userData.traffic ? world.userData.traffic.SIGNALS : null;
                if (sigs && world.userData.traffic.sigState) {
                    const glow = 0.42 + nightK * 1.5;
                    for (let i = 0; i < sigs.length; i++) {
                        const s = sigs[i];
                        const st = world.userData.traffic.sigState(s.node, s.axis, t);
                        s.red.emissiveIntensity = st === 'red' ? 2.6 * glow : 0.04;
                        s.yellow.emissiveIntensity = st === 'yellow' ? 2.6 * glow : 0.04;
                        s.green.emissiveIntensity = st === 'green' ? 2.6 * glow : 0.04;
                    }
                }

                // ═════ 天气：定时切换 + 参数平滑过渡 ═════
                if (!weatherLock) wTimer -= dt;
                if (wTimer <= 0 && !weatherLock) {
                    let k = wKeys[Math.floor(rand() * wKeys.length)];
                    if (WEATHER[k] === wCur) k = wKeys[(wKeys.indexOf(k) + 1) % wKeys.length];
                    wCur = WEATHER[k];
                    wTimer = 26 + rand() * 22;
                }
                const wk = Math.min(1, dt * 0.62);
                wNow.fog += (wCur.fog - wNow.fog) * wk;
                wNow.sun += (wCur.sun - wNow.sun) * wk;
                wNow.rain += (wCur.rain - wNow.rain) * wk;
                wNow.snow += (wCur.snow - wNow.snow) * wk;
                wNow.wind += (wCur.wind - wNow.wind) * wk;
                wNow.storm += ((wCur.storm || 0) - wNow.storm) * wk;
                // 路面：下雨很快打湿，雨停后慢慢变干；积雪同理，融化比堆积更慢
                const wetT = Math.min(1, wNow.rain);
                wNow.wet += (wetT - wNow.wet) * Math.min(1, dt * (wetT > wNow.wet ? 0.5 : 0.06));
                wNow.cover += (wNow.snow - wNow.cover) * Math.min(1, dt * (wNow.snow > wNow.cover ? 0.12 : 0.05));
                wTint.lerp(wCur.tintC, wk);

                // 光照叠加：阴雨天压暗发灰，暴晒提亮偏暖
                sun.intensity *= wNow.sun;
                sun.color.lerp(wTint, 0.25);
                hemi.intensity *= 0.62 + wNow.sun * 0.38;
                fill.intensity *= 0.70 + wNow.sun * 0.30;
                renderer.toneMappingExposure *= 0.88 + wNow.sun * 0.12;

                // 雷暴闪电：双闪 + 指数衰减，叠加到光照、曝光与泛光
                lightT -= dt;
                if (wNow.storm > 0.6 && lightT <= 0) { flash = 1; flash2 = 0.16 + rand() * 0.14; lightT = 3.5 + rand() * 7; }
                if (flash2 > 0) { flash2 -= dt; if (flash2 <= 0) flash = 0.8; }
                flash *= Math.exp(-dt * 7);
                hemi.intensity += flash * 1.5;
                fill.intensity += flash * 0.5;
                renderer.toneMappingExposure += flash * 0.45;
                if (bloomPass) bloomPass.strength = 0.4 + 0.25 * nightK + flash * 0.9;

                // 路面湿润反光 / 屋顶草地积雪
                for (let i = 0; i < surf.length; i++) {
                    const sf = surf[i];
                    sf.m.color.copy(sf.base).multiplyScalar(1 - sf.wet * wNow.wet).lerp(snowWhite, sf.snow * wNow.cover);
                    sf.m.roughness = sf.r0 - sf.wr * wNow.wet;
                }

                // 雾：雨雪天起雾，夜里减淡避免糊成一团
                scene.fog.density = Math.min(0.0115, (wNow.fog + 0.0032) * (0.35 + daylight * 0.65));   // 封顶，最浓时也看得清街区   // 常驻极淡雾，远处建筑有空气透视
                fogC.copy(skyC).lerp(wTint, 0.55);
                scene.fog.color.copy(fogC);

                // 雨：竖向高速下落，被风吹出斜度
                if (wNow.rain > 0.02) {
                    rainPts.visible = true;
                    rainPts.material.opacity = 0.52 * wNow.rain;
                    const ra = rainPts.geometry.attributes.position.array;
                    const rwx = 7 * wNow.wind;
                    for (let i = 0; i < RAIN_N; i++) {
                        const j = i * 3;
                        ra[j] += rwx * dt;
                        ra[j + 1] -= rainSpeed[i] * dt;
                        ra[j + 2] += rwx * 0.45 * dt;
                        if (ra[j + 1] < -0.5) {
                            ra[j + 1] += WP.y;
                            ra[j] = (rand() - 0.5) * WP.x;
                            ra[j + 2] = (rand() - 0.5) * WP.z;
                        } else {
                            if (ra[j] > WP.x * 0.5) ra[j] -= WP.x;
                            if (ra[j] < -WP.x * 0.5) ra[j] += WP.x;
                            if (ra[j + 2] > WP.z * 0.5) ra[j + 2] -= WP.z;
                            if (ra[j + 2] < -WP.z * 0.5) ra[j + 2] += WP.z;
                        }
                    }
                    rainPts.geometry.attributes.position.needsUpdate = true;
                } else if (rainPts.visible) {
                    rainPts.visible = false;
                }

                // 雪：缓慢下落 + 左右飘摆
                if (wNow.snow > 0.02) {
                    snowPts.visible = true;
                    snowPts.material.opacity = 0.85 * wNow.snow;
                    const sa = snowPts.geometry.attributes.position.array;
                    const swx = 4 * wNow.wind;
                    for (let i = 0; i < SNOW_N; i++) {
                        const j = i * 3;
                        sa[j] += (Math.sin(t * 0.9 + snowPhase[i]) * 1.8 + swx) * dt;
                        sa[j + 1] -= snowSpeed[i] * dt;
                        sa[j + 2] += Math.cos(t * 0.7 + snowPhase[i]) * 1.2 * dt;
                        if (sa[j + 1] < -0.3) {
                            sa[j + 1] += WP.y;
                            sa[j] = (rand() - 0.5) * WP.x;
                            sa[j + 2] = (rand() - 0.5) * WP.z;
                        } else {
                            if (sa[j] > WP.x * 0.5) sa[j] -= WP.x;
                            if (sa[j] < -WP.x * 0.5) sa[j] += WP.x;
                            if (sa[j + 2] > WP.z * 0.5) sa[j + 2] -= WP.z;
                            if (sa[j + 2] < -WP.z * 0.5) sa[j + 2] += WP.z;
                        }
                    }
                    snowPts.geometry.attributes.position.needsUpdate = true;
                } else if (snowPts.visible) {
                    snowPts.visible = false;
                }

                // 云朵：颜色随昼夜变化，整圈缓慢绕行（不会飘到沙盘正上方挡视线）
                cloudMat.color.copy(cloudNight).lerp(cloudDay, daylight);
                cloudMat.opacity = 0.5 + daylight * 0.4;
                cloudMat.color.multiplyScalar(1 - 0.38 * Math.min(1, wNow.rain) - 0.1 * wNow.snow);
                cloudMat.opacity = Math.min(1, cloudMat.opacity + 0.3 * Math.min(1, wNow.rain));
                cloudRing.rotation.y += dt * 0.012 * wNow.wind;
                // 每朵云叠加独立的上下浮动，让云更像在缓慢飘动
                for (let i = 0; i < cloudRing.children.length; i++) {
                    const c = cloudRing.children[i];
                    c.position.y = c.userData.cloudBaseY + Math.sin(t * 0.16 + c.userData.cloudPhase) * c.userData.cloudFloat;
                }

                // 小吃街人流：沿街来回走动
                for (let i = 0; i < crowd.length; i++) {
                    const p = crowd[i];
                    if (fleeStep(p.g, dt)) continue;
                    const a = t * p.sp + p.ph;
                    p.g.position.x = p.x + Math.sin(a) * p.amp;
                    p.g.rotation.y = Math.cos(a) > 0 ? Math.PI / 2 : -Math.PI / 2;
                }

                // 飞鸟：定时放飞，飞出场地后回收
                birdTimer -= dt;
                if (birdTimer <= 0 && birds.length < 3) {
                    spawnBird();
                    birdTimer = 7 + rand() * 11;
                }
                for (let i = birds.length - 1; i >= 0; i--) {
                    const b = birds[i], u = b.userData;
                    u.age += dt;
                    b.position.addScaledVector(u.dir, u.speed * dt);
                    b.position.y += Math.sin(u.age * 1.6 + u.phase) * dt * 0.6;
                    const flap = Math.sin(t * 9 + u.phase) * 0.62;
                    u.wings[0].rotation.z = flap;
                    u.wings[1].rotation.z = -flap;
                    if (b.position.length() > 96) {
                        world.remove(b);
                        birds.splice(i, 1);
                    }
                }

                if (auto && !dragging && !celebrated) {
                    idle += dt;
                    if (idle > 2.4) view.tYaw += dt * 0.085;
                }

                if (!dragging && Math.abs(velYaw) > 0.0004) { view.tYaw += velYaw * dt * 60; velYaw *= Math.exp(-dt * 3.4); } else if (!dragging) velYaw = 0;
                const s = 1 - Math.exp(-dt * 8);   // 与帧率无关的阻尼
                view.yaw += (view.tYaw - view.yaw) * s;
                view.pitch += (view.tPitch - view.pitch) * s;
                view.dist += (view.tDist - view.dist) * s;
                view.cx += (view.tcx - view.cx) * s;
                view.cz += (view.tcz - view.cz) * s;

                const cp = Math.cos(view.pitch);
                camera.position.set(
                    view.cx + Math.sin(view.yaw) * cp * view.dist,
                    Math.sin(view.pitch) * view.dist,
                    view.cz + Math.cos(view.yaw) * cp * view.dist
                );
                // 竖屏时视线压低，让沙盘整体上移，给底部卡片腾出空间
                const portrait = camera.aspect < 0.95;
                const lookY = 0.6 + (portrait ? (active > 0 && !celebrated ? -4.4 : -3.3) : 0);
                camera.lookAt(view.cx, lookY, view.cz);

                // 当前分区的光环呼吸 + 轻微抬升
                for (let i = 0; i < zoneGroups.length; i++) {
                    const on = i === active;
                    const ty = on ? 0.24 + Math.sin(t * 1.5) * 0.05 : 0.16;
                    zoneGroups[i].position.y += (ty - zoneGroups[i].position.y) * 0.08;
                    rings[i].material.emissiveIntensity = on ? 0.34 + Math.sin(t * 2.8) * 0.2 : 0.07;
                }

                for (let i = 0; i < floats.length; i++) {
                    const f = floats[i];
                    f.o.position.y = f.base + Math.sin(t * f.speed + f.phase) * f.amp;
                }
                for (let i = 0; i < 4; i++) floats[i].o.rotation.y += dt * 0.5;

                // 公园里的人：行人绕中央步道走，玩耍的人在空地小范围来回
                // 河面是障碍：走到岸边就掉头，不会踩着水穿过去
                for (let i = 0; i < people.length; i++) {
                    const p = people[i];
                    if (fleeStep(p.g, dt)) continue;
                    if (p.mode === 'walk') {
                        const curX = PX + Math.cos(p.t * Math.PI * 2) * walkR;
                        const curZ = PZ + Math.sin(p.t * Math.PI * 2) * walkR;
                        const nt = (p.t + dt * p.speed * p.dir + 1) % 1;
                        const nX = PX + Math.cos(nt * Math.PI * 2) * walkR;
                        const nZ = PZ + Math.sin(nt * Math.PI * 2) * walkR;
                        if (inRiver(nX, nZ, 0.35) && !inRiver(curX, curZ, 0.35)) {
                            p.dir = -p.dir; // 到河边掉头
                        } else {
                            p.t = nt;
                        }
                        const ang = p.t * Math.PI * 2;
                        p.g.position.set(PX + Math.cos(ang) * walkR, 0.15, PZ + Math.sin(ang) * walkR);
                        p.g.rotation.y = ang + Math.PI / 2 + (p.dir < 0 ? Math.PI : 0);
                    } else {
                        let ang = t * p.speed * p.dir + p.phase;
                        if (inRiver(p.cx + Math.cos(ang) * p.r, p.cz + Math.sin(ang) * p.r, 0.3)) {
                            p.dir = -p.dir;
                            ang = t * p.speed * p.dir + p.phase;
                        }
                        p.g.position.set(p.cx + Math.cos(ang) * p.r, 0.15, p.cz + Math.sin(ang) * p.r);
                        p.g.rotation.y = ang + Math.PI / 2;
                    }
                }

                // 人行道上的行人：来回散步、遛狗，站着聊天的人轻微起伏
                for (let i = 0; i < swWalkers.length; i++) {
                    const w = swWalkers[i];
                    if (fleeStep(w.g, dt)) continue;
                    w.pos += w.dir * w.speed * dt;
                    if (w.pos > w.max) { w.pos = w.max; w.dir = -1; }
                    else if (w.pos < w.min) { w.pos = w.min; w.dir = 1; }
                    if (w.axis === 'x') w.g.position.set(w.pos, SWY, w.fixed);
                    else w.g.position.set(w.fixed, SWY, w.pos);
                    if (w.dog) {
                        const lead = w.dir * 0.42;
                        const side = 0.24;
                        w.dog.position.set(
                            w.axis === 'x' ? w.pos + lead : w.fixed + side,
                            SWY + 0.045,
                            w.axis === 'x' ? w.fixed + side : w.pos + lead
                        );
                        w.dog.rotation.y = w.axis === 'x'
                            ? (w.dir > 0 ? Math.PI / 2 : -Math.PI / 2)
                            : (w.dir > 0 ? 0 : Math.PI);
                    }
                }
                for (let i = 0; i < swChatters.length; i++) {
                    const c = swChatters[i];
                    if (fleeStep(c.g, dt)) continue;
                    c.g.position.y = SWY + Math.sin(t * 1.7 + c.phase) * 0.012;
                }

                // 公交车：沿外围矩形绕行，到站停靠、乘客上下车
                if (busSystem.update) busSystem.update(dt, t);

                // 公园配套：健身器材/秋千/跷跷板摆动、宠物跑动、烧烤烟雾
                if (parkFacilities.update) parkFacilities.update(dt, t);

                // 交通设施：高铁往返 + 巡航飞机盘旋
                if (transportFacilities.update) transportFacilities.update(dt, t);

                // 城市生活：塔吊施工、无障碍通行、交警拦停与放行电动车
                if (civicLife.update) civicLife.update(dt, t);

                // 湖中鱼群：缓慢游动、摆尾，错峰跃出水面
                if (lakeFish.update) lakeFish.update(dt, t);

                // 城市新景：摩天轮/云霄飞车/邮轮起伏、气象台风速计、电视台警示灯
                if (cityWonders.update) cityWonders.update(dt, t);

                // 车辆：沿棋盘格路网行驶，到路口自动转弯
                const traffic = world.userData.traffic;
                const agents = world.userData.agents;
                if (traffic && agents) {
                    const NODES = traffic.NODES, EDGES = traffic.EDGES, ADJ = traffic.ADJ;
                    const sigState = traffic.sigState, agentPos = traffic.agentPos;
                    const probe = { x: 0, z: 0 };

                    // 马路身份（水平路用 z、竖直路用 x）+ 前进坐标 + 前进方向符号，用于跨共线边的跟车判断
                    function rf(edge, dir, t) {
                        const e = EDGES[edge];
                        const horiz = Math.abs(e.dx) > Math.abs(e.dz);
                        const a = NODES[e.a];
                        const tt = (dir === 1) ? t : (1 - t);
                        return { horiz: horiz, road: horiz ? a.z : a.x, sign: (dir === 1) ? 1 : -1,
                            fwd: horiz ? (a.x + e.dx * tt) : (a.z + e.dz * tt) };
                    }

                    for (let i = 0; i < agents.length; i++) {
                        const c = agents[i];
                        let e = EDGES[c.edge];

                        // 消失 / 出现：用缩放做淡出淡入
                        if (c.state === 'shrink') {
                            c.scale -= dt / 0.20;
                            if (c.scale <= 0) {
                                // 找一段前后都没车的路段重新出现，避免一生成就叠车
                                let ek = c.edge, nd = 1, nt = 0.5, placed = false;
                                for (let tryN = 0; tryN < 24 && !placed; tryN++) {
                                    ek = traffic.EDGE_KEYS[Math.floor(Math.random() * traffic.EDGE_KEYS.length)];
                                    nd = Math.random() < 0.5 ? 1 : -1;
                                    nt = 0.10 + Math.random() * 0.80;
                                    agentPos(ek, nd, nt, c.lane, probe);
                                    placed = true;
                                    for (let k = 0; k < agents.length; k++) {
                                        if (agents[k] === c) continue;
                                        const p = agents[k].g.position;
                                        if (Math.abs(p.x - probe.x) < 2.8 && Math.abs(p.z - probe.z) < 2.8) { placed = false; break; }
                                    }
                                }
                                c.edge = ek; c.dir = nd; c.t = nt;
                                c.scale = 0; c.state = 'grow';
                                let h = EDGES[ek].heading + (nd === -1 ? Math.PI : 0);
                                if (h > Math.PI) h -= Math.PI * 2;
                                if (h < -Math.PI) h += Math.PI * 2;
                                c.heading = h; c.targetHeading = h;
                                e = EDGES[c.edge];
                            }
                        } else if (c.state === 'grow') {
                            c.scale = Math.min(1, c.scale + dt / 0.28);
                            if (c.scale >= 1) { c.scale = 1; c.state = 'drive'; }
                        }

                        // 行驶推进（淡出过程中停在原地）
                        if (c.state !== 'shrink') {
                            // ── 跟车：同马路同方向同车道的前车太近就减速（跨共线边也生效）──
                            let factor = 1;
                            const need = c.type === 'bike' ? 1.25 : 2.0;
                            const ck = rf(c.edge, c.dir, c.t);
                            for (let k = 0; k < agents.length; k++) {
                                if (k === i) continue;
                                const o = agents[k];
                                const ok = rf(o.edge, o.dir, o.t);
                                if (ok.horiz !== ck.horiz || ok.road !== ck.road) continue;   // 不同马路
                                if (ok.sign !== ck.sign) continue;                           // 对向车不影响
                                if (Math.abs(o.lane - c.lane) > 0.3) continue;               // 不同车道互不影响
                                const gap = (ok.fwd - ck.fwd) * ck.sign;
                                if (gap <= 0) continue;
                                if (gap < need) factor = Math.min(factor, Math.max(0, (gap - need * 0.45) / (need * 0.55)));
                            }

                            // ── 公交车是大目标：小车在它身后同样要减速等待（跨共线边也生效）──
                            const bl = world.userData.busList;
                            if (bl && c.type === 'car') {
                                for (let k = 0; k < bl.buses.length; k++) {
                                    const bb = bl.buses[k], sg = bl.route[bb.seg];
                                    const bk = rf(sg.edge, sg.dir, bb.t);
                                    if (bk.horiz !== ck.horiz || bk.road !== ck.road || bk.sign !== ck.sign) continue;
                                    const gap = (bk.fwd - ck.fwd) * ck.sign;
                                    if (gap > 0 && gap < 3.4) factor = Math.min(factor, Math.max(0, (gap - 1.8) / 1.6));
                                }
                            }

                            // ── 红灯：前方路口本方向是红灯就停在停止线外 ──
                            const arrivedKey = (c.dir === 1) ? e.b : e.a;
                            let stopT = 1;
                            if (!traffic.TERMINALS[arrivedKey]) {
                                const axis = Math.abs(e.dx) > Math.abs(e.dz) ? 'ew' : 'ns';
                                if (sigState(arrivedKey, axis, t) === 'red') stopT = 1 - 4.3 / e.len;
                            }

                            // ── 点击交互：被点中的车立刻停下 + 往对向变道，双闪由 interactUpdate 驱动 ──
                            const ccs = clickState.cars.get(c);
                            if (ccs) {
                                ccs.t -= dt;
                                factor = 0;   // 停下
                                if (ccs.t > 1.0) c.lane += (ccs.laneTo - c.lane) * Math.min(1, dt * 3.5);    // 前段：变到对向车道
                                else c.lane += (ccs.laneFrom - c.lane) * Math.min(1, dt * 3.5);              // 后段：平滑驶回原车道
                                if (ccs.t <= 0) { c.lane = ccs.laneFrom; clickState.cars.delete(c); }       // 时间到归位，车灯交回 interactUpdate
                            }

                            let nt = c.t + (dt * c.speed * factor) / e.len;
                            if (nt > stopT && c.t <= stopT) nt = stopT;
                            c.t = nt;

                            if (c.t >= 1) {
                                if (traffic.TERMINALS[arrivedKey]) {
                                    // 开到路尽头：停在末端淡出，稍后在别处重新出现
                                    c.t = 1;
                                    c.state = 'shrink';
                                } else {
                                    // 路口：60% 直行，其余随机转弯
                                    c.t = 0;
                                    const opts = ADJ[arrivedKey].filter(function (ek) { return ek !== c.edge; });
                                    let nextEdge;
                                    if (opts.length > 0 && Math.random() < 0.6) {
                                        let best = opts[0], bestDiff = Infinity;
                                        opts.forEach(function (ek) {
                                            const cand = EDGES[ek];
                                            const d = (arrivedKey === cand.a) ? 1 : -1;
                                            let hh = cand.heading + (d === -1 ? Math.PI : 0);
                                            if (hh > Math.PI) hh -= Math.PI * 2;
                                            if (hh < -Math.PI) hh += Math.PI * 2;
                                            let diff = Math.abs(hh - c.heading);
                                            if (diff > Math.PI) diff = Math.PI * 2 - diff;
                                            if (diff < bestDiff) { bestDiff = diff; best = ek; }
                                        });
                                        nextEdge = best;
                                    } else if (opts.length > 0) {
                                        nextEdge = opts[Math.floor(Math.random() * opts.length)];
                                    } else {
                                        nextEdge = c.edge;
                                    }
                                    const ne = EDGES[nextEdge];
                                    const newDir = (arrivedKey === ne.a) ? 1 : -1;
                                    c.edge = nextEdge;
                                    c.dir = newDir;
                                    let th = ne.heading + (newDir === -1 ? Math.PI : 0);
                                    if (th > Math.PI) th -= Math.PI * 2;
                                    if (th < -Math.PI) th += Math.PI * 2;
                                    c.targetHeading = th;
                                    e = EDGES[c.edge];
                                }
                            }
                        }

                        // 计算当前位置：边内插值 + 靠右车道偏移
                        const ee = EDGES[c.edge];
                        const A = NODES[ee.a];
                        const tt = (c.dir === 1) ? c.t : (1 - c.t);
                        const sx = (c.dir === 1) ? ee.dx : -ee.dx;
                        const sz = (c.dir === 1) ? ee.dz : -ee.dz;
                        const il = 1 / ee.len;
                        c.g.position.set(
                            A.x + ee.dx * tt - sz * il * c.lane,
                            0.05,
                            A.z + ee.dz * tt + sx * il * c.lane
                        );
                        // 车头朝向平滑插值（避免瞬间旋转）
                        let dh = c.targetHeading - c.heading;
                        while (dh > Math.PI) dh -= Math.PI * 2;
                        while (dh < -Math.PI) dh += Math.PI * 2;
                        c.heading += dh * Math.min(1, dt * 11);
                        c.g.rotation.y = c.heading;
                        c.g.scale.setScalar(Math.max(0.001, c.scale));
                    }
                }

                // ═════ 过街行人：跟着红绿灯走斑马线 ═════
                const crossers = traffic ? traffic.CROSSERS : null;
                if (crossers) {
                    for (let i = 0; i < crossers.length; i++) {
                        const cr = crossers[i];
                        if (fleeStep(cr.g, dt)) continue;
                        // 自己要横穿的那条路必须处于红灯（车已停）
                        const canWalk = !traffic.sigState || traffic.sigState(cr.node, cr.axis, t) === 'red';
                        if (canWalk) {
                            cr.u += dt * 0.34 * cr.dir;
                            if (cr.u > 1) { cr.u = 1; cr.dir = -1; }
                            if (cr.u < 0) { cr.u = 0; cr.dir = 1; }
                        }
                        const off = -1.75 + cr.u * 3.5;
                        if (cr.mode === 'x') {
                            cr.g.position.set(cr.along + off, 0.15, cr.fixed);
                            cr.g.rotation.y = cr.dir > 0 ? Math.PI * 0.5 : -Math.PI * 0.5;
                        } else {
                            cr.g.position.set(cr.fixed, 0.15, cr.along + off);
                            cr.g.rotation.y = cr.dir > 0 ? 0 : Math.PI;
                        }
                    }
                }

                // 点击交互：被点车辆的车灯双闪脉冲（位置/变道/逃跑已在各循环内处理）
                interactUpdate(dt, t);

                updatePills();
                if (composer) composer.render(); else renderer.render(scene, camera);

                if (firstFrame) {
                    firstFrame = false;
                    measureCard();
                    syncUI(0);
                    stepperEl.classList.add('show');
                }
            }
            renderer.setAnimationLoop(frame);

            /* ══════════ 后处理：bloom 朦胧光晕（异步加载，失败则降级普通渲染） ══════════ */
            (async function () {
                try {
                    const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }] = await Promise.all([
                        import('three/addons/postprocessing/EffectComposer.js'),
                        import('three/addons/postprocessing/RenderPass.js'),
                        import('three/addons/postprocessing/UnrealBloomPass.js')
                    ]);
                    // 带 4x MSAA 的渲染目标：开 bloom 后边缘不再有锯齿
                    const msaaRT = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: renderer.capabilities.isWebGL2 ? 4 : 0 });
                    composer = new EffectComposer(renderer, msaaRT);
                    composer.setPixelRatio(renderer.getPixelRatio());
                    composer.addPass(new RenderPass(scene, camera));
                    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.4, 0.7, 0.85);
                    composer.addPass(bloom);
                    bloomPass = bloom;
                    composer.setSize(innerWidth, innerHeight);
                } catch (err) {
                    console.warn('[gate3d] bloom 后处理加载失败，降级普通渲染', err);
                }
            })();

            /* ══════════ 尺寸变化 ══════════ */
            function onResize() {
                camera.aspect = innerWidth / innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
                if (composer) composer.setSize(innerWidth, innerHeight);
                view.tDist = clamp(view.tDist, minDist(), maxDist());
                view.dist = clamp(view.dist, minDist(), maxDist());
                measureCard();
                if (pencilEl && stepEls[active]) {
                    pencilEl.style.left = (stepEls[active].offsetLeft + stepEls[active].offsetWidth / 2) + 'px';
                }
            }
            addEventListener('resize', onResize);
            addEventListener('orientationchange', function () { setTimeout(onResize, 260); });
            if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
            setTimeout(onResize, 400);

            /* ══════════ 对外接口（解锁庆祝） ══════════ */
            window.__gate3d = {
                celebrate: function () {
                    celebrated = true;
                    auto = false;
                    view.tDist = fitDistance() * 0.72;
                    view.tPitch = 0.84;
                    view.tYaw = view.yaw + 1.15;
                    view.tcx = 0;
                    view.tcz = 0;
                    if (stepEls[active]) pencilEl.classList.remove('show');
                },
                focus: focusZone,
                setWeather: setWeather
            };

            // 支持 ?focus=0..4 直接聚焦某个分区（也可当分享深链用）
            const fp = parseInt(new URLSearchParams(location.search).get('focus'), 10);
            if (!isNaN(fp) && fp >= 0 && fp < ZONES.length) {
                auto = false;
                setTimeout(function () {
                    focusZone(fp);
                    // 深链直接到位，不做补间
                    view.yaw = view.tYaw; view.pitch = view.tPitch; view.dist = view.tDist;
                    view.cx = view.tcx; view.cz = view.tcz;
                }, 900);
            }

        }
    </script>
</body>
</html>
