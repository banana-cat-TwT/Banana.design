<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波光粼粼水流背景</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        #water-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }



        #fps-counter {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #0ff;
            font-family: monospace;
            font-size: 12px;
            background: rgba(0,20,40,0.7);
            padding: 5px 10px;
            border-radius: 6px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <canvas id="water-canvas"></canvas>
    <div id="fps-counter">FPS: 60</div>

    <script>
    class WaterEffect {
        constructor(canvasId) {
            this.canvas = document.getElementById(canvasId);
            this.ctx = this.canvas.getContext('2d');
            
            // 配置
            this.config = {
                // 波浪层 - 增强动态效果
                waves: [
                    { amplitude: 15, wavelength: 0.01, speed: 0.025, yOffset: 0.15 },
                    { amplitude: 20, wavelength: 0.008, speed: 0.02, yOffset: 0.3 },
                    { amplitude: 25, wavelength: 0.006, speed: 0.015, yOffset: 0.45 },
                    { amplitude: 30, wavelength: 0.004, speed: 0.012, yOffset: 0.6 },
                    { amplitude: 35, wavelength: 0.003, speed: 0.008, yOffset: 0.75 }
                ],
                // 波光粼粼闪光点 - 增加数量
                sparkleCount: 300,
                // 颜色
                colors: {
                    top: '#081830',
                    mid1: '#0b2442',
                    mid2: '#123c70',
                    bottom: '#165895'
                }
            };

            this.sparkles = [];
            this.time = 0;
            this.lastTime = 0;
            this.fps = 60;
            this.frameCount = 0;
            this.lastFpsUpdate = 0;
            this.paused = false;

            this.init();
        }

        init() {
            this.resize();
            this.createSparkles();
            this.bindEvents();
            this.animate();
        }

        resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            this.width = window.innerWidth;
            this.height = window.innerHeight;
            
            this.canvas.width = this.width * dpr;
            this.canvas.height = this.height * dpr;
            this.canvas.style.width = this.width + 'px';
            this.canvas.style.height = this.height + 'px';
            
            this.ctx.scale(dpr, dpr);
            
            // 根据屏幕大小调整闪光点数量
            this.config.sparkleCount = this.width < 768 ? 100 : 200;
            this.createSparkles();
        }

        createSparkles() {
            this.sparkles = [];
            for (let i = 0; i < this.config.sparkleCount; i++) {
                this.sparkles.push({
                    x: Math.random() * this.width,
                    y: Math.random() * this.height,
                    size: Math.random() * 3 + 1,
                    speed: Math.random() * 0.5 + 0.2,
                    phase: Math.random() * Math.PI * 2,
                    frequency: Math.random() * 3 + 2,
                    maxAlpha: Math.random() * 0.7 + 0.3
                });
            }
        }

        bindEvents() {
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => this.resize(), 150);
            });

            document.addEventListener('visibilitychange', () => {
                this.paused = document.hidden;
                if (!this.paused) {
                    this.lastTime = performance.now();
                    this.animate();
                }
            });
        }

        drawGradientBackground() {
            const gradient = this.ctx.createLinearGradient(0, 0, 0, this.height);
            gradient.addColorStop(0, this.config.colors.top);
            gradient.addColorStop(0.3, this.config.colors.mid1);
            gradient.addColorStop(0.6, this.config.colors.mid2);
            gradient.addColorStop(1, this.config.colors.bottom);
            this.ctx.fillStyle = gradient;
            this.ctx.fillRect(0, 0, this.width, this.height);
        }

        drawWaves() {
            this.config.waves.forEach((wave, index) => {
                const { amplitude, wavelength, speed, yOffset } = wave;
                const baseY = this.height * yOffset;
                const alpha = 0.15 + index * 0.05;
                
                this.ctx.beginPath();
                this.ctx.moveTo(0, this.height);
                
                // 采样步长
                const step = 4;
                
                for (let x = 0; x <= this.width; x += step) {
                    // 每层波浪独特的多重正弦波叠加，产生独立的动态效果
                    const y = baseY + 
                        Math.sin(x * wavelength + this.time * speed) * amplitude +
                        Math.sin(x * wavelength * 1.5 + this.time * speed * 1.3 + index * 0.5) * amplitude * 0.5 +
                        Math.sin(x * wavelength * 0.5 + this.time * speed * 0.7 + index * 1.0) * amplitude * 0.3 +
                        Math.sin(x * wavelength * 2.5 + this.time * speed * 1.8 + index * 1.5) * amplitude * 0.2;
                    
                    if (x === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                
                this.ctx.lineTo(this.width, this.height);
                this.ctx.lineTo(0, this.height);
                this.ctx.closePath();
                
                // 波浪渐变填充
                const waveGradient = this.ctx.createLinearGradient(0, baseY - amplitude * 2, 0, this.height);
                waveGradient.addColorStop(0, `rgba(100, 180, 255, ${alpha})`);
                waveGradient.addColorStop(0.5, `rgba(60, 140, 220, ${alpha * 0.8})`);
                waveGradient.addColorStop(1, `rgba(30, 100, 180, ${alpha * 0.5})`);
                
                this.ctx.fillStyle = waveGradient;
                this.ctx.fill();
            });
        }

        drawSparkles() {
            this.sparkles.forEach(sparkle => {
                // 计算闪烁alpha（多频率叠加产生自然效果）
                const flicker1 = Math.sin(this.time * sparkle.frequency + sparkle.phase) * 0.5 + 0.5;
                const flicker2 = Math.sin(this.time * sparkle.frequency * 1.7 + sparkle.phase * 1.3) * 0.3 + 0.7;
                const flicker3 = Math.sin(this.time * sparkle.frequency * 0.5 + sparkle.phase * 0.7) * 0.2 + 0.8;
                const alpha = flicker1 * flicker2 * flicker3 * sparkle.maxAlpha;
                
                // 只有alpha足够大时才绘制
                if (alpha > 0.1) {
                    const size = sparkle.size * (0.8 + alpha * 0.4);
                    
                    // 绘制光晕
                    const gradient = this.ctx.createRadialGradient(
                        sparkle.x, sparkle.y, 0,
                        sparkle.x, sparkle.y, size * 3
                    );
                    gradient.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
                    gradient.addColorStop(0.3, `rgba(200, 230, 255, ${alpha * 0.6})`);
                    gradient.addColorStop(1, 'rgba(100, 180, 255, 0)');
                    
                    this.ctx.beginPath();
                    this.ctx.arc(sparkle.x, sparkle.y, size * 3, 0, Math.PI * 2);
                    this.ctx.fillStyle = gradient;
                    this.ctx.fill();
                    
                    // 绘制核心亮点
                    this.ctx.beginPath();
                    this.ctx.arc(sparkle.x, sparkle.y, size * 0.5, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 1.2})`;
                    this.ctx.fill();
                }
                
                // 缓慢随机移动
                sparkle.x += Math.sin(this.time * 0.5 + sparkle.phase) * 0.3;
                sparkle.y += Math.cos(this.time * 0.3 + sparkle.phase) * 0.2;
                
                // 边界循环
                if (sparkle.x < -10) sparkle.x = this.width + 10;
                if (sparkle.x > this.width + 10) sparkle.x = -10;
                if (sparkle.y < -10) sparkle.y = this.height + 10;
                if (sparkle.y > this.height + 10) sparkle.y = -10;
            });
        }

        drawLightRays() {
            // 绘制柔和的光线效果
            for (let i = 0; i < 5; i++) {
                const x = (this.width / 5) * i + Math.sin(this.time * 0.2 + i) * 30;
                const width = 60 + Math.sin(this.time * 0.3 + i * 0.5) * 20;
                
                const gradient = this.ctx.createLinearGradient(x, 0, x + width, this.height);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.03)');
                gradient.addColorStop(0.5, 'rgba(200, 230, 255, 0.02)');
                gradient.addColorStop(1, 'rgba(100, 180, 255, 0)');
                
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(x, 0, width, this.height);
            }
        }

        updateFPS(currentTime) {
            this.frameCount++;
            
            if (currentTime - this.lastFpsUpdate >= 1000) {
                this.fps = this.frameCount;
                this.frameCount = 0;
                this.lastFpsUpdate = currentTime;
                document.getElementById('fps-counter').textContent = `FPS: ${this.fps}`;
            }
        }

        animate(currentTime = 0) {
            if (this.paused) return;

            const deltaTime = currentTime - this.lastTime;
            this.lastTime = currentTime;
            
            // 限制时间步长
            const cappedDelta = Math.min(deltaTime, 50);
            this.time += cappedDelta * 0.003;

            // 清空并绘制
            this.ctx.clearRect(0, 0, this.width, this.height);
            
            this.drawGradientBackground();
            this.drawLightRays();
            this.drawWaves();
            this.drawSparkles();
            
            this.updateFPS(currentTime);

            requestAnimationFrame((t) => this.animate(t));
        }
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
        new WaterEffect('water-canvas');
    });
    </script>
</body>
</html>
