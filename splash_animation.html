<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明日方舟 - 相见欢</title>
    <style>
        :root {
            --primary-red: #D32F2F;
            --dark-bg: #121212;
            --text-light: #F5F5F5;
            --text-dark: #333333;
            --font-serif: 'Noto Serif SC', 'SimSun', serif;
            --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--dark-bg);
            font-family: var(--font-sans);
            color: var(--text-light);
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(211, 47, 47, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-red);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            font-family: var(--font-serif);
            letter-spacing: 4px;
            color: var(--primary-red);
            font-size: 1.2rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Video Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            background-color: #000;
            transition: opacity 1.5s ease, visibility 1.5s;
        }

        #splash-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Controls */
        .controls-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1010;
        }

        .btn {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 20px;
            border-radius: 4px;
            font-family: var(--font-sans);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .btn:hover {
            background: rgba(211, 47, 47, 0.8);
            border-color: var(--primary-red);
        }

        #skip-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            letter-spacing: 2px;
        }

        #mute-btn {
            position: absolute;
            bottom: 40px;
            right: 30px;
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mute-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Progress Bar */
        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary-red);
            transition: width 0.1s linear;
        }

        /* Main Content */
        #main-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, var(--dark-bg) 100%);
            opacity: 0;
            visibility: hidden;
            transition: opacity 2s ease;
        }

        .main-bg-decoration {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(211, 47, 47, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(211, 47, 47, 0.05) 0%, transparent 40%);
            z-index: 1;
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            text-align: center;
            transform: translateY(30px);
            transition: transform 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        #main-content.active .content-wrapper {
            transform: translateY(0);
        }

        .logo-container {
            margin-bottom: 40px;
            position: relative;
            display: inline-block;
        }

        .lantern-logo {
            width: 80px;
            height: 100px;
            background: linear-gradient(135deg, #ff4d4d, var(--primary-red));
            border-radius: 40px 40px 10px 10px;
            position: relative;
            margin: 0 auto;
            box-shadow: 0 0 30px rgba(211, 47, 47, 0.4);
        }

        .lantern-logo::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 10px;
            background: #333;
            border-radius: 5px 5px 0 0;
        }

        .lantern-logo::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 15px;
            background: #ffcc00;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
        }

        .title-cn {
            font-family: var(--font-serif);
            font-size: 5rem;
            font-weight: normal;
            letter-spacing: 1rem;
            margin-right: -1rem; /* offset letter spacing */
            margin-bottom: 10px;
            background: linear-gradient(to bottom, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .title-en {
            font-family: var(--font-sans);
            font-size: 1rem;
            letter-spacing: 6px;
            color: var(--primary-red);
            margin-bottom: 50px;
            text-transform: uppercase;
        }

        .enter-btn {
            display: inline-block;
            padding: 15px 40px;
            background: transparent;
            border: 1px solid var(--primary-red);
            color: var(--text-light);
            font-family: var(--font-serif);
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--primary-red);
            transition: all 0.4s ease;
            z-index: -1;
        }

        .enter-btn:hover {
            color: #fff;
            box-shadow: 0 0 20px rgba(211, 47, 47, 0.5);
        }

        .enter-btn:hover::before {
            left: 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .title-cn {
                font-size: 3.5rem;
            }
            .title-en {
                font-size: 0.8rem;
                letter-spacing: 3px;
            }
            #skip-btn {
                top: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader"></div>
        <div class="loading-text">载入中</div>
    </div>

    <!-- Splash Screen (Video) -->
    <div id="splash-screen">
        <!-- local: mrfz.mp4 -->
        <video id="splash-video" muted playsinline>
            <source src="https://venus-vedas-1258344701.cos-internal.ap-guangzhou.tencentcos.cn//formal/20260407/attachment/giselacheng/fb09cc1f-0d04-456f-8fc8-22c77d0af623/mrfz.mp4" type="video/mp4">
            您的浏览器不支持 HTML5 视频。
        </video>
        
        <div class="controls-container">
            <button id="skip-btn" class="btn">跳过动画</button>
            
            <button id="mute-btn" class="btn">
                <svg class="mute-icon" id="icon-muted" viewBox="0 0 24 24" style="display: block;">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
                <svg class="mute-icon" id="icon-unmuted" viewBox="0 0 24 24" style="display: none;">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
            </button>
            
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content">
        <div class="main-bg-decoration"></div>
        <div class="content-wrapper">
            <div class="logo-container">
                <div class="lantern-logo"></div>
            </div>
            <h1 class="title-cn">相见欢</h1>
            <div class="title-en">SUCH IS THE JOY OF OUR REUNION</div>
            <a href="#" class="enter-btn">进入官网</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('splash-video');
            const splashScreen = document.getElementById('splash-screen');
            const mainContent = document.getElementById('main-content');
            const loadingScreen = document.getElementById('loading-screen');
            const skipBtn = document.getElementById('skip-btn');
            const muteBtn = document.getElementById('mute-btn');
            const progressBar = document.getElementById('progress-bar');
            const iconMuted = document.getElementById('icon-muted');
            const iconUnmuted = document.getElementById('icon-unmuted');

            // Remove loading screen when video is ready to play
            video.addEventListener('canplaythrough', () => {
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    // Attempt to play video
                    video.play().catch(e => {
                        console.log("Auto-play prevented by browser:", e);
                        // If autoplay fails, we might want to show a play button, 
                        // but for now we just let the user skip or interact
                    });
                }, 800);
            });

            // Fallback if video takes too long to load
            setTimeout(() => {
                if (loadingScreen.style.display !== 'none') {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        video.play().catch(e => console.log(e));
                    }, 800);
                }
            }, 3000);

            // Update progress bar
            video.addEventListener('timeupdate', () => {
                if (video.duration) {
                    const progress = (video.currentTime / video.duration) * 100;
                    progressBar.style.width = progress + '%';
                }
            });

            // Transition to main content
            const showMainContent = () => {
                splashScreen.style.opacity = '0';
                splashScreen.style.visibility = 'hidden';
                
                mainContent.style.visibility = 'visible';
                mainContent.style.opacity = '1';
                mainContent.classList.add('active');
                
                // Pause video to save resources
                setTimeout(() => {
                    video.pause();
                }, 1500);
            };

            // Video ended event
            video.addEventListener('ended', showMainContent);

            // Skip button click
            skipBtn.addEventListener('click', showMainContent);

            // Mute toggle
            muteBtn.addEventListener('click', () => {
                video.muted = !video.muted;
                if (video.muted) {
                    iconMuted.style.display = 'block';
                    iconUnmuted.style.display = 'none';
                } else {
                    iconMuted.style.display = 'none';
                    iconUnmuted.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
