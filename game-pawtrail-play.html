  Paw&Trail（爪与迹）· itch.io 网页试玩版（游玩页，配色与游戏详情页一致）
  说明：此页面用于内嵌 WebGL 试玩构建。目前为占位，等 WebGL 构建提供后：
   1. 把构建产物（index.html + Build/ + TemplateData/）放到 pawtrail-web/ 目录；
   2. 将下方 iframe 的 src 改成 "pawtrail-web/index.html"（或你提供的可内嵌地址）即可。

<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="巴拿拿猫 BananaCat · Banana.design">
    <meta name="copyright" content="© 2026 巴拿拿猫 (BananaCat) · Banana.design">
    <title>Paw&Trail（爪与迹）· 在线试玩</title>
    <style>
        :root {
            --bg: #FBF1DC;
            --panel: #FFFBF1;
            --line: #EAD3A2;
            --soft: #F6E2B3;
            --accent: #E3A54E;
            --accent-hover: #D68A30;
            --text: #7A5A38;
            --text-dim: #8A6A3A;
            --text-faint: #B88650;
            --em: #A85F1C;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; -webkit-font-smoothing: antialiased; }
        a { color: var(--em); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .shell { display: flex; flex-direction: column; height: 100vh; }

        /* 顶栏 */
        .topbar {
            height: 56px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 18px;
            flex: 0 0 auto;
        }
        .topbar .logo { font-size: 1.3rem; font-weight: 700; color: var(--em); letter-spacing: -0.5px; white-space: nowrap; }
        .topbar .logo em { font-style: normal; color: var(--text); }
        .topbar .title { font-size: 1rem; color: var(--text); font-weight: 600; }
        .topbar .spacer { flex: 1; }
        .topbar .back {
            font-size: 0.85rem;
            color: var(--em);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 7px 14px;
            background: var(--soft);
            transition: background .15s ease;
        }
        .topbar .back:hover { background: #F0D8A2; text-decoration: none; color: var(--em); }

        /* 游戏区 */
        .stage { flex: 1 1 auto; position: relative; min-height: 0; }
        .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }

        /* 占位提示（WebGL 构建接入后自动被 iframe 覆盖） */
        .placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            text-align: center;
            padding: 24px;
            background:
                radial-gradient(120% 90% at 50% 20%, #FAEFD2 0%, #FBF1DC 70%);
        }
        .placeholder .paw {
            width: 84px; height: 84px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.6rem;
            background: var(--soft);
            border: 1px solid var(--line);
            border-radius: 24px;
            animation: float 2.6s ease-in-out infinite;
        }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .placeholder h1 { font-size: 1.6rem; font-weight: 700; color: var(--em); }
        .placeholder p { color: var(--text-dim); font-size: 0.95rem; max-width: 460px; line-height: 1.7; }
        .placeholder .hint { color: var(--text-faint); font-size: 0.82rem; }

        /* 底部操作条 */
        .foot {
            flex: 0 0 auto;
            background: var(--panel);
            border-top: 1px solid var(--line);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 0.8rem;
            color: var(--text-dim);
        }
        .foot .key { display: inline-block; padding: 2px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--soft); color: var(--text); font-size: 0.76rem; }
        .foot .dl { margin-left: auto; color: #fff; background: var(--accent); border: 2px solid var(--accent-hover); border-radius: 6px; padding: 8px 16px; font-weight: 600; font-size: 0.85rem; box-shadow: 0 8px 22px rgba(227, 165, 78, 0.30); transition: background .15s ease; }
        .foot .dl:hover { background: var(--accent-hover); text-decoration: none; }
    </style>

    <!-- 51.la 访客统计 V6 -->
    <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
    <script>LA.init({id:"3Qu6OIFKMWrFWPyF",ck:"3Qu6OIFKMWrFWPyF"})</script>
<script src="anti-bot.js" defer></script>
</head>
<body>
    <script src="gate.js"></script>
    <div class="shell">
        <div class="topbar">
            <div class="logo">itch<em>.io</em></div>
            <div class="title">Paw&amp;Trail · 在线试玩</div>
            <div class="spacer"></div>
            <a class="back" href="game-travel-dog.html">游戏详情</a>
            <a class="back" href="game-pawtrail.html">返回下载页</a>
        </div>

        <div class="stage">
            <!--
              WebGL 试玩 iframe 占位：
              等拿到可内嵌构建后，把 src 改为实际地址即可，
              例如 src="pawtrail-web/index.html"
            -->
            <iframe id="game-frame" src="pawtrail-web/index.html" title="Paw&Trail 在线试玩" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
        </div>

        <div class="foot">
            <span>操作提示</span>
            <span><span class="key">WASD</span> 移动</span>
            <span><span class="key">E</span> 交互</span>
            <span><span class="key">C</span> 拍照</span>
            <span><span class="key">J</span> 手帐</span>
            <a class="dl" href="game-pawtrail.html">下载游戏</a>
        </div>
    </div>
</body>
</html>
